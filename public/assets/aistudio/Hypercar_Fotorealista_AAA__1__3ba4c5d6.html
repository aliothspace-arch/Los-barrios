<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/**
 * ============================================================================
 * HYPERCAR MID-ENGINE V12 — MOTOR GEOMÉTRICO CLASE-A & PBR AAA (MOBILE-SAFE)
 * ============================================================================
 * Arquitectura blindada para Android/iOS WebView y escritorio:
 * - Cero primitivas simples (superficies paramétricas, lofts, tubos y lathes).
 * - Pintura tricapa Rosso Fuoco nativa con MeshPhysicalMaterial (sheen + iridescence).
 * - EffectComposer estándar con fallback automático a renderizado directo.
 * - Coreografía continua + interacción directa por toque/clic en puertas, capó y ruedas.
 */

function showFatalError(msg) {
    const el = document.getElementById('webgl-error');
    const txt = document.getElementById('webgl-error-msg');
    if (el && txt) {
        txt.textContent = String(msg || 'Error de inicialización WebGL');
        el.style.display = 'flex';
    }
}

// ============================================================================
// 1. UTILIDADES MATEMÁTICAS Y MOTOR DE SUPERFICIES PARAMÉTRICAS CLASE-A
// ============================================================================

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const safeNum = (v, fallback = 0) => (Number.isFinite(v) ? v : fallback);
const smoothstep = (e0, e1, x) => {
    const d = e1 - e0;
    if (Math.abs(d) < 1e-8) return x < e0 ? 0 : 1;
    const t = clamp((x - e0) / d, 0, 1);
    return t * t * (3 - 2 * t);
};
const smootherstep = (e0, e1, x) => {
    const d = e1 - e0;
    if (Math.abs(d) < 1e-8) return x < e0 ? 0 : 1;
    const t = clamp((x - e0) / d, 0, 1);
    return t * t * t * (t * (t * 6 - 15) + 10);
};
const gauss = (x, mu, sigma) => {
    const s = Math.max(Math.abs(sigma), 1e-5);
    return Math.exp(-0.5 * Math.pow((x - mu) / s, 2));
};

// Dimensiones maestras del hiperdeportivo (~4.58 m x 2.04 m x 1.13 m, batalla 2.72 m)
const SPEC = {
    fZ: 1.38,
    fR: 0.345,
    fW: 0.275,
    fOuterX: 0.965,
    fTrack: 0.965 - 0.275 * 0.5,
    fArchR: 0.382,

    rZ: -1.34,
    rR: 0.365,
    rW: 0.345,
    rOuterX: 1.005,
    rTrack: 1.005 - 0.345 * 0.5,
    rArchR: 0.405
};

/**
 * Construye una BufferGeometry paramétrica Clase-A con salvaguarda NaN y costuras suaves.
 */
function buildParametricSurface(uSegs, vSegs, evalFn, options = {}) {
    const {
        uvScaleU = 1.0,
        uvScaleV = 1.0,
        worldUV = false,
        flipWinding = false,
        closedU = false,
        closedV = false,
        forceSymmetrySeamX0 = false
    } = options;

    const uCount = uSegs + 1;
    const vCount = vSegs + 1;
    const positions = new Float32Array(uCount * vCount * 3);
    const uvs = new Float32Array(uCount * vCount * 2);

    let pIdx = 0;
    let uvIdx = 0;
    for (let iu = 0; iu <= uSegs; iu++) {
        const u = iu / uSegs;
        for (let iv = 0; iv <= vSegs; iv++) {
            const v = iv / vSegs;
            const p = evalFn(u, v);
            const px = safeNum(p[0], 0);
            const py = safeNum(p[1], 0);
            const pz = safeNum(p[2], 0);
            positions[pIdx++] = px;
            positions[pIdx++] = py;
            positions[pIdx++] = pz;

            if (worldUV) {
                uvs[uvIdx++] = (pz * 0.90 + py * 0.42) * uvScaleU;
                uvs[uvIdx++] = (px * 0.90 + py * 0.46) * uvScaleV;
            } else {
                uvs[uvIdx++] = u * uvScaleU;
                uvs[uvIdx++] = v * uvScaleV;
            }
        }
    }

    const indices = [];
    for (let iu = 0; iu < uSegs; iu++) {
        for (let iv = 0; iv < vSegs; iv++) {
            const a = iu * vCount + iv;
            const b = (iu + 1) * vCount + iv;
            const c = (iu + 1) * vCount + (iv + 1);
            const d = iu * vCount + (iv + 1);
            if (flipWinding) {
                indices.push(a, c, b, a, d, c);
            } else {
                indices.push(a, b, c, a, c, d);
            }
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const normals = geo.attributes.normal;
    const pos = geo.attributes.position;

    if (closedV) {
        for (let iu = 0; iu <= uSegs; iu++) {
            const i0 = iu * vCount;
            const i1 = iu * vCount + vSegs;
            const nx = normals.getX(i0) + normals.getX(i1);
            const ny = normals.getY(i0) + normals.getY(i1);
            const nz = normals.getZ(i0) + normals.getZ(i1);
            const l = Math.hypot(nx, ny, nz) || 1;
            normals.setXYZ(i0, nx / l, ny / l, nz / l);
            normals.setXYZ(i1, nx / l, ny / l, nz / l);
        }
    }
    if (closedU) {
        for (let iv = 0; iv <= vSegs; iv++) {
            const i0 = iv;
            const i1 = uSegs * vCount + iv;
            const nx = normals.getX(i0) + normals.getX(i1);
            const ny = normals.getY(i0) + normals.getY(i1);
            const nz = normals.getZ(i0) + normals.getZ(i1);
            const l = Math.hypot(nx, ny, nz) || 1;
            normals.setXYZ(i0, nx / l, ny / l, nz / l);
            normals.setXYZ(i1, nx / l, ny / l, nz / l);
        }
    }
    if (forceSymmetrySeamX0) {
        for (let i = 0; i < pos.count; i++) {
            if (Math.abs(pos.getX(i)) < 1e-4) {
                const ny = normals.getY(i);
                const nz = normals.getZ(i);
                const l = Math.hypot(ny, nz) || 1;
                normals.setXYZ(i, 0, ny / l, nz / l);
            }
        }
    }
    normals.needsUpdate = true;
    return geo;
}

/**
 * Filtra puntos duplicados consecutivos para blindar CatmullRomCurve3 contra NaN.
 */
function sanitizeCurvePoints(points, closed = false) {
    const out = [];
    for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const v = (p instanceof THREE.Vector3)
            ? p.clone()
            : new THREE.Vector3(safeNum(p[0]), safeNum(p[1]), safeNum(p[2]));
        if (out.length === 0 || out[out.length - 1].distanceToSquared(v) > 1e-8) {
            out.push(v);
        }
    }
    if (closed && out.length > 2 && out[0].distanceToSquared(out[out.length - 1]) < 1e-8) {
        out.pop();
    }
    if (out.length < 2) {
        const base = out[0] || new THREE.Vector3();
        out.push(base.clone().add(new THREE.Vector3(0, 0, 0.001)));
    }
    return out;
}

/**
 * Loft suave multi-estación interpolado por Catmull-Rom centrípeto.
 */
function buildSplineLoft(stations, uSegs, vSegs, options = {}) {
    const {
        closedV = false,
        worldUV = true,
        uvScaleU = 1.0,
        uvScaleV = 1.0,
        flipWinding = false
    } = options;

    const sampled = stations.map(pts => {
        const vecs = sanitizeCurvePoints(pts, closedV);
        const curve = new THREE.CatmullRomCurve3(vecs, closedV, 'centripetal', 0.5);
        const row = [];
        for (let iv = 0; iv <= vSegs; iv++) {
            row.push(curve.getPoint(iv / vSegs));
        }
        return row;
    });

    const longCurves = [];
    for (let iv = 0; iv <= vSegs; iv++) {
        const col = sanitizeCurvePoints(sampled.map(r => r[iv]), false);
        longCurves.push(new THREE.CatmullRomCurve3(col, false, 'centripetal', 0.5));
    }

    const tmp = new THREE.Vector3();
    return buildParametricSurface(uSegs, vSegs, (u, v) => {
        const iv = clamp(Math.round(v * vSegs), 0, vSegs);
        longCurves[iv].getPoint(clamp(u, 0, 1), tmp);
        return [tmp.x, tmp.y, tmp.z];
    }, { closedV, worldUV, uvScaleU, uvScaleV, flipWinding });
}

/**
 * Tubo esculpido de sección elíptica variable con tapas redondeadas a lo largo de un spline 3D.
 */
function buildVariableTube(points, radiusFn, tubularSegs = 32, radialSegs = 12, options = {}) {
    const {
        closed = false,
        capStart = true,
        capEnd = true,
        aspectY = 1.0,
        worldUV = false,
        uvScaleU = 2.0,
        uvScaleV = 1.0
    } = options;

    const vecs = sanitizeCurvePoints(points, closed);
    const curve = new THREE.CatmullRomCurve3(vecs, closed, 'centripetal', 0.5);
    const frames = curve.computeFrenetFrames(tubularSegs, closed);

    const extraStart = (!closed && capStart) ? 2 : 0;
    const extraEnd = (!closed && capEnd) ? 2 : 0;
    const totalU = tubularSegs + extraStart + extraEnd;

    const pt = new THREE.Vector3();
    const normal = new THREE.Vector3();
    const binormal = new THREE.Vector3();
    const tangent = new THREE.Vector3();

    return buildParametricSurface(totalU, radialSegs, (uRaw, v) => {
        const idxF = uRaw * totalU;
        let t = 0;
        let capScale = 1.0;
        let capPush = 0.0;

        if (idxF < extraStart) {
            t = 0;
            const ang = (idxF / extraStart) * Math.PI * 0.5;
            capScale = Math.sin(ang);
            capPush = -Math.cos(ang);
        } else if (idxF > extraStart + tubularSegs) {
            t = 1;
            const ang = ((idxF - extraStart - tubularSegs) / extraEnd) * Math.PI * 0.5;
            capScale = Math.cos(ang);
            capPush = Math.sin(ang);
        } else {
            t = (idxF - extraStart) / tubularSegs;
        }

        const fIdx = clamp(Math.round(t * tubularSegs), 0, tubularSegs);
        curve.getPointAt(clamp(t, 0, 1), pt);
        normal.copy(frames.normals[fIdx]);
        binormal.copy(frames.binormals[fIdx]);
        tangent.copy(frames.tangents[fIdx]);

        const radRes = typeof radiusFn === 'function' ? radiusFn(t) : radiusFn;
        const rx = Math.max(1e-5, (Array.isArray(radRes) ? radRes[0] : radRes) * capScale);
        const ry = Math.max(1e-5, (Array.isArray(radRes) ? radRes[1] : radRes * aspectY) * capScale);
        const pushR = (Array.isArray(radRes) ? Math.min(radRes[0], radRes[1]) : radRes) * 0.6;

        const theta = v * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        return [
            pt.x + (normal.x * cosT * rx + binormal.x * sinT * ry) + tangent.x * capPush * pushR,
            pt.y + (normal.y * cosT * rx + binormal.y * sinT * ry) + tangent.y * capPush * pushR,
            pt.z + (normal.z * cosT * rx + binormal.z * sinT * ry) + tangent.z * capPush * pushR
        ];
    }, { closedV: true, closedU: closed, worldUV, uvScaleU, uvScaleV });
}

/**
 * Perfil aerodinámico NACA combado con espesor real.
 */
function buildSculptedAirfoil(uSegs, vSegs, specFn) {
    return buildParametricSurface(uSegs, vSegs, (u, v) => {
        const s = specFn(u);
        const theta = v * Math.PI * 2;
        const xc = 0.5 * (1 + Math.cos(theta));
        const sign = Math.sin(theta) >= 0 ? 1 : -1;

        const yt = 5 * s.thickness * (
            0.2969 * Math.sqrt(Math.max(xc, 1e-6)) -
            0.1260 * xc -
            0.3516 * xc * xc +
            0.2843 * xc * xc * xc -
            0.1015 * xc * xc * xc * xc
        );
        const yc = (s.camber || 0) * 4 * xc * (1 - xc);

        const localZ = (0.35 - xc) * s.chord;
        const localY = (yc + sign * yt) * s.chord;

        const cosP = Math.cos(s.pitch || 0);
        const sinP = Math.sin(s.pitch || 0);
        const rotZ = localZ * cosP - localY * sinP;
        const rotY = localZ * sinP + localY * cosP;

        const cosR = Math.cos(s.roll || 0);
        const sinR = Math.sin(s.roll || 0);

        return [
            s.x - rotY * sinR,
            s.y + rotY * cosR,
            s.z + rotZ
        ];
    }, { closedV: true, worldUV: true, uvScaleU: 1.5, uvScaleV: 1.5 });
}

/**
 * Espejado exacto sobre X = 0 invirtiendo winding y espejando normales.
 */
function mirrorGeometryX(sourceGeo) {
    const geo = sourceGeo.clone();
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        pos.setX(i, -pos.getX(i));
    }
    pos.needsUpdate = true;

    const idx = geo.index;
    if (idx) {
        for (let i = 0; i < idx.count; i += 3) {
            const b = idx.getX(i + 1);
            const c = idx.getX(i + 2);
            idx.setX(i + 1, c);
            idx.setX(i + 2, b);
        }
        idx.needsUpdate = true;
    } else {
        for (let i = 0; i < pos.count; i += 3) {
            const x1 = pos.getX(i + 1), y1 = pos.getY(i + 1), z1 = pos.getZ(i + 1);
            pos.setXYZ(i + 1, pos.getX(i + 2), pos.getY(i + 2), pos.getZ(i + 2));
            pos.setXYZ(i + 2, x1, y1, z1);
        }
        pos.needsUpdate = true;
    }

    const norm = geo.attributes.normal;
    if (norm) {
        for (let i = 0; i < norm.count; i++) {
            norm.setX(i, -norm.getX(i));
        }
        norm.needsUpdate = true;
    } else {
        geo.computeVertexNormals();
    }
    return geo;
}

function addMirroredMesh(parent, geo, material, castShadow = true, receiveShadow = true) {
    const mR = new THREE.Mesh(geo, material);
    mR.castShadow = castShadow;
    mR.receiveShadow = receiveShadow;
    parent.add(mR);

    const mL = new THREE.Mesh(mirrorGeometryX(geo), material);
    mL.castShadow = castShadow;
    mL.receiveShadow = receiveShadow;
    parent.add(mL);

    return [mR, mL];
}

// ============================================================================
// 2. TEXTURAS PBR PROCEDURALES (<= 512x512 MOBILE-SAFE) Y MATERIALES NATIVOS
// ============================================================================

function createProceduralTextures(maxAnisotropy) {
    const tex = {};
    const aniso = Math.min(maxAnisotropy || 4, 8);

    // A. Micro-Flakes Metálicos (Normal + Roughness) para Rosso Fuoco
    {
        const size = 256;
        const nC = document.createElement('canvas');
        const rC = document.createElement('canvas');
        nC.width = nC.height = rC.width = rC.height = size;
        const nCtx = nC.getContext('2d');
        const rCtx = rC.getContext('2d');
        const nImg = nCtx.createImageData(size, size);
        const rImg = rCtx.createImageData(size, size);

        let seed = 48271;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

        for (let i = 0; i < size * size; i++) {
            const p = i * 4;
            const isFlake = rand() > 0.62;
            const spark = isFlake ? (rand() * 2 - 1) * 0.22 : (rand() * 2 - 1) * 0.05;
            const ang = rand() * Math.PI * 2;
            const nx = Math.cos(ang) * spark;
            const ny = Math.sin(ang) * spark;
            const nz = Math.sqrt(Math.max(0.2, 1 - nx * nx - ny * ny));
            nImg.data[p] = Math.round((nx * 0.5 + 0.5) * 255);
            nImg.data[p + 1] = Math.round((ny * 0.5 + 0.5) * 255);
            nImg.data[p + 2] = Math.round((nz * 0.5 + 0.5) * 255);
            nImg.data[p + 3] = 255;

            const rv = isFlake ? Math.round(28 + rand() * 22) : Math.round(42 + rand() * 16);
            rImg.data[p] = rImg.data[p + 1] = rImg.data[p + 2] = rv;
            rImg.data[p + 3] = 255;
        }
        nCtx.putImageData(nImg, 0, 0);
        rCtx.putImageData(rImg, 0, 0);

        tex.flakeNormal = new THREE.CanvasTexture(nC);
        tex.flakeNormal.wrapS = tex.flakeNormal.wrapT = THREE.RepeatWrapping;
        tex.flakeNormal.repeat.set(18, 18);
        tex.flakeNormal.anisotropy = aniso;

        tex.flakeRough = new THREE.CanvasTexture(rC);
        tex.flakeRough.wrapS = tex.flakeRough.wrapT = THREE.RepeatWrapping;
        tex.flakeRough.repeat.set(18, 18);
        tex.flakeRough.anisotropy = aniso;
    }

    // B. Fibra de Carbono 2x2 Twill de Autoclave (512x512)
    {
        const size = 512;
        const aC = document.createElement('canvas');
        const nC = document.createElement('canvas');
        const rC = document.createElement('canvas');
        aC.width = aC.height = nC.width = nC.height = rC.width = rC.height = size;
        const aCtx = aC.getContext('2d');
        const nCtx = nC.getContext('2d');
        const rCtx = rC.getContext('2d');
        const aImg = aCtx.createImageData(size, size);
        const nImg = nCtx.createImageData(size, size);
        const rImg = rCtx.createImageData(size, size);

        const cells = 32;
        const cellSize = size / cells;

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cx = Math.floor(x / cellSize);
                const cy = Math.floor(y / cellSize);
                const lx = (x % cellSize) / cellSize;
                const ly = (y % cellSize) / cellSize;

                const isWarp = ((cx + cy) % 4) < 2;
                const u = isWarp ? lx : ly;
                const v = isWarp ? ly : lx;

                const arch = Math.sin(u * Math.PI);
                const along = 0.72 + 0.28 * Math.sin(v * Math.PI);
                const strand = 0.92 + 0.08 * Math.sin(u * Math.PI * 6);

                const base = isWarp ? 28 : 13;
                const val = clamp(Math.round((base + arch * along * (isWarp ? 34 : 18)) * strand), 9, 72);

                const p = (y * size + x) * 4;
                aImg.data[p] = val;
                aImg.data[p + 1] = Math.round(val * 1.02);
                aImg.data[p + 2] = Math.round(val * 1.06);
                aImg.data[p + 3] = 255;

                const sU = Math.cos(u * Math.PI) * 0.34;
                const sV = Math.cos(v * Math.PI) * 0.14;
                const nx = isWarp ? sU : sV;
                const ny = isWarp ? sV : sU;
                const nz = Math.sqrt(Math.max(0.2, 1 - nx * nx - ny * ny));
                nImg.data[p] = Math.round((nx * 0.5 + 0.5) * 255);
                nImg.data[p + 1] = Math.round((ny * 0.5 + 0.5) * 255);
                nImg.data[p + 2] = Math.round((nz * 0.5 + 0.5) * 255);
                nImg.data[p + 3] = 255;

                const rough = clamp(Math.round((isWarp ? 0.22 : 0.42) * 255 - arch * 18), 38, 150);
                rImg.data[p] = rImg.data[p + 1] = rImg.data[p + 2] = rough;
                rImg.data[p + 3] = 255;
            }
        }
        aCtx.putImageData(aImg, 0, 0);
        nCtx.putImageData(nImg, 0, 0);
        rCtx.putImageData(rImg, 0, 0);

        tex.carbonMap = new THREE.CanvasTexture(aC);
        tex.carbonMap.colorSpace = THREE.SRGBColorSpace;
        tex.carbonMap.wrapS = tex.carbonMap.wrapT = THREE.RepeatWrapping;
        tex.carbonMap.repeat.set(9, 9);
        tex.carbonMap.anisotropy = aniso;

        tex.carbonNormal = new THREE.CanvasTexture(nC);
        tex.carbonNormal.wrapS = tex.carbonNormal.wrapT = THREE.RepeatWrapping;
        tex.carbonNormal.repeat.set(9, 9);
        tex.carbonNormal.anisotropy = aniso;

        tex.carbonRough = new THREE.CanvasTexture(rC);
        tex.carbonRough.wrapS = tex.carbonRough.wrapT = THREE.RepeatWrapping;
        tex.carbonRough.repeat.set(9, 9);
        tex.carbonRough.anisotropy = aniso;
    }

    // C. Titanio Templado por Calor (256x256)
    {
        const w = 256, h = 256;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0.00, '#726d66');
        g.addColorStop(0.24, '#9b9182');
        g.addColorStop(0.44, '#c49854');
        g.addColorStop(0.56, '#874c56');
        g.addColorStop(0.66, '#4f3b92');
        g.addColorStop(0.75, '#1d53b8');
        g.addColorStop(0.83, '#22242c');
        g.addColorStop(1.00, '#050507');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        tex.titaniumMap = new THREE.CanvasTexture(c);
        tex.titaniumMap.colorSpace = THREE.SRGBColorSpace;
        tex.titaniumMap.wrapS = THREE.RepeatWrapping;
        tex.titaniumMap.wrapT = THREE.ClampToEdgeWrapping;
    }

    // D. Rejilla Hexagonal Fotograbada (256x256)
    {
        const size = 256;
        const cC = document.createElement('canvas');
        const bC = document.createElement('canvas');
        cC.width = cC.height = bC.width = bC.height = size;
        const cCtx = cC.getContext('2d');
        const bCtx = bC.getContext('2d');

        cCtx.fillStyle = '#1e2128';
        cCtx.fillRect(0, 0, size, size);
        bCtx.fillStyle = '#ffffff';
        bCtx.fillRect(0, 0, size, size);

        const r = 13;
        const dx = r * 1.5;
        const dy = r * Math.sqrt(3);
        const hexPath = (ctx, cx, cy, rad) => {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i * Math.PI) / 3;
                const px = cx + Math.cos(a) * rad;
                const py = cy + Math.sin(a) * rad;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        };

        for (let col = -1; col < size / dx + 2; col++) {
            for (let row = -1; row < size / dy + 2; row++) {
                const cx = col * dx;
                const cy = row * dy + (col % 2 === 0 ? 0 : dy * 0.5);
                hexPath(bCtx, cx, cy, r * 0.78);
                bCtx.fillStyle = '#060606';
                bCtx.fill();

                hexPath(cCtx, cx, cy, r * 0.86);
                cCtx.strokeStyle = '#383d48';
                cCtx.lineWidth = 1.6;
                cCtx.stroke();

                hexPath(cCtx, cx, cy, r * 0.78);
                cCtx.fillStyle = '#040507';
                cCtx.fill();
            }
        }

        tex.hexMap = new THREE.CanvasTexture(cC);
        tex.hexMap.colorSpace = THREE.SRGBColorSpace;
        tex.hexMap.wrapS = tex.hexMap.wrapT = THREE.RepeatWrapping;
        tex.hexMap.repeat.set(9, 4);
        tex.hexMap.anisotropy = aniso;

        tex.hexBump = new THREE.CanvasTexture(bC);
        tex.hexBump.wrapS = tex.hexBump.wrapT = THREE.RepeatWrapping;
        tex.hexBump.repeat.set(9, 4);
    }

    // E. Disco de Freno Carbono-Cerámico Perforado (512x512)
    {
        const size = 512;
        const cC = document.createElement('canvas');
        const bC = document.createElement('canvas');
        cC.width = cC.height = bC.width = bC.height = size;
        const cCtx = cC.getContext('2d');
        const bCtx = bC.getContext('2d');
        const half = size / 2;

        cCtx.fillStyle = '#52565e';
        cCtx.fillRect(0, 0, size, size);
        bCtx.fillStyle = '#cccccc';
        bCtx.fillRect(0, 0, size, size);

        let seed = 8831;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

        for (let i = 0; i < 7000; i++) {
            const ang = rand() * Math.PI * 2;
            const rad = (0.48 + rand() * 0.50) * half;
            const px = half + Math.cos(ang) * rad;
            const py = half + Math.sin(ang) * rad;
            const s = Math.round(62 + rand() * 64);
            cCtx.fillStyle = `rgb(${s},${s + 2},${s + 5})`;
            cCtx.fillRect(px, py, 2, 2);
        }

        for (let r = half * 0.51; r < half * 0.96; r += 2.0) {
            const a = 0.05 + rand() * 0.08;
            cCtx.beginPath();
            cCtx.arc(half, half, r, 0, Math.PI * 2);
            cCtx.strokeStyle = rand() > 0.5 ? `rgba(225,230,240,${a})` : `rgba(24,26,30,${a})`;
            cCtx.lineWidth = 1.0;
            cCtx.stroke();
        }

        const groups = 12;
        for (let g = 0; g < groups; g++) {
            const baseA = (g / groups) * Math.PI * 2;
            for (let k = 0; k < 4; k++) {
                const rad = half * (0.57 + k * 0.098);
                const ang = baseA + k * 0.075;
                const hx = half + Math.cos(ang) * rad;
                const hy = half + Math.sin(ang) * rad;

                cCtx.beginPath();
                cCtx.arc(hx, hy, 4.4, 0, Math.PI * 2);
                cCtx.fillStyle = '#32363d';
                cCtx.fill();

                cCtx.beginPath();
                cCtx.arc(hx, hy, 3.1, 0, Math.PI * 2);
                cCtx.fillStyle = '#060709';
                cCtx.fill();

                bCtx.beginPath();
                bCtx.arc(hx, hy, 3.8, 0, Math.PI * 2);
                bCtx.fillStyle = '#000000';
                bCtx.fill();
            }

            const sA = baseA + Math.PI / groups;
            cCtx.beginPath();
            cCtx.moveTo(half + Math.cos(sA) * half * 0.58, half + Math.sin(sA) * half * 0.58);
            cCtx.quadraticCurveTo(
                half + Math.cos(sA + 0.06) * half * 0.77,
                half + Math.sin(sA + 0.06) * half * 0.77,
                half + Math.cos(sA + 0.14) * half * 0.92,
                half + Math.sin(sA + 0.14) * half * 0.92
            );
            cCtx.strokeStyle = '#111318';
            cCtx.lineWidth = 2.6;
            cCtx.lineCap = 'round';
            cCtx.stroke();

            bCtx.beginPath();
            bCtx.moveTo(half + Math.cos(sA) * half * 0.58, half + Math.sin(sA) * half * 0.58);
            bCtx.quadraticCurveTo(
                half + Math.cos(sA + 0.06) * half * 0.77,
                half + Math.sin(sA + 0.06) * half * 0.77,
                half + Math.cos(sA + 0.14) * half * 0.92,
                half + Math.sin(sA + 0.14) * half * 0.92
            );
            bCtx.strokeStyle = '#121212';
            bCtx.lineWidth = 3.0;
            bCtx.lineCap = 'round';
            bCtx.stroke();
        }

        tex.rotorMap = new THREE.CanvasTexture(cC);
        tex.rotorMap.colorSpace = THREE.SRGBColorSpace;
        tex.rotorMap.anisotropy = aniso;

        tex.rotorBump = new THREE.CanvasTexture(bC);
        tex.rotorBump.anisotropy = aniso;
    }

    // F. Neumático Semi-Slick de Competición (512x512)
    {
        const w = 512, h = 512;
        const cC = document.createElement('canvas');
        const bC = document.createElement('canvas');
        const rC = document.createElement('canvas');
        cC.width = bC.width = rC.width = w;
        cC.height = bC.height = rC.height = h;
        const cCtx = cC.getContext('2d');
        const bCtx = bC.getContext('2d');
        const rCtx = rC.getContext('2d');

        cCtx.fillStyle = '#202328';
        cCtx.fillRect(0, 0, w, h);
        bCtx.fillStyle = '#888888';
        bCtx.fillRect(0, 0, w, h);
        rCtx.fillStyle = '#a4a4a4';
        rCtx.fillRect(0, 0, w, h);

        let seed = 3191;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        for (let i = 0; i < 6000; i++) {
            const v = Math.round(26 + rand() * 14);
            cCtx.fillStyle = `rgb(${v},${v + 1},${v + 3})`;
            cCtx.fillRect(rand() * w, rand() * h, 2, 2);
        }

        const drawSidewall = (y0, y1) => {
            const ym = (y0 + y1) * 0.5;
            bCtx.strokeStyle = '#d4d4d4';
            bCtx.lineWidth = 3.0;
            bCtx.beginPath(); bCtx.moveTo(0, ym - 14); bCtx.lineTo(w, ym - 14); bCtx.stroke();
            bCtx.beginPath(); bCtx.moveTo(0, ym + 14); bCtx.lineTo(w, ym + 14); bCtx.stroke();

            for (let i = 0; i < 64; i++) {
                const x = (i / 64) * w;
                if (i % 16 < 10) {
                    bCtx.fillStyle = '#b4b4b4';
                    bCtx.fillRect(x, ym - 10, w / 128, 20);
                    rCtx.fillStyle = '#7e7e7e';
                    rCtx.fillRect(x, ym - 10, w / 128, 20);
                    cCtx.fillStyle = '#181a1f';
                    cCtx.fillRect(x, ym - 10, w / 128, 20);
                }
            }
        };
        drawSidewall(h * 0.05, h * 0.24);
        drawSidewall(h * 0.76, h * 0.95);

        cCtx.fillStyle = '#24272d';
        cCtx.fillRect(0, h * 0.27, w, h * 0.46);
        rCtx.fillStyle = '#b4b4b4';
        rCtx.fillRect(0, h * 0.27, w, h * 0.46);

        [[h * 0.39, 8], [h * 0.51, 10], [h * 0.62, 8]].forEach(([gy, gw]) => {
            cCtx.fillStyle = '#090a0d';
            cCtx.fillRect(0, gy - gw / 2, w, gw);
            bCtx.fillStyle = '#080808';
            bCtx.fillRect(0, gy - gw / 2, w, gw);
            rCtx.fillStyle = '#dedede';
            rCtx.fillRect(0, gy - gw / 2, w, gw);
        });

        const pitches = 36;
        const step = w / pitches;
        for (let i = 0; i < pitches; i++) {
            const x0 = i * step;
            [
                [h * 0.27, h * 0.38, 1.35],
                [h * 0.63, h * 0.73, -1.25],
                [h * 0.40, h * 0.50, 0.90],
                [h * 0.52, h * 0.61, -0.85]
            ].forEach(([ya, yb, slant]) => {
                for (let wrap = -1; wrap <= 1; wrap++) {
                    const ox = x0 + wrap * w;
                    cCtx.beginPath();
                    cCtx.moveTo(ox, ya);
                    cCtx.quadraticCurveTo(ox + step * slant * 0.5, (ya + yb) * 0.5, ox + step * slant, yb);
                    cCtx.strokeStyle = '#0a0b0e';
                    cCtx.lineWidth = 3.2;
                    cCtx.stroke();

                    bCtx.beginPath();
                    bCtx.moveTo(ox, ya);
                    bCtx.quadraticCurveTo(ox + step * slant * 0.5, (ya + yb) * 0.5, ox + step * slant, yb);
                    bCtx.strokeStyle = '#121212';
                    bCtx.lineWidth = 3.8;
                    bCtx.stroke();
                }
            });
        }

        tex.tireMap = new THREE.CanvasTexture(cC);
        tex.tireMap.colorSpace = THREE.SRGBColorSpace;
        tex.tireMap.wrapS = THREE.RepeatWrapping;
        tex.tireMap.wrapT = THREE.ClampToEdgeWrapping;
        tex.tireMap.anisotropy = aniso;

        tex.tireBump = new THREE.CanvasTexture(bC);
        tex.tireBump.wrapS = THREE.RepeatWrapping;
        tex.tireBump.wrapT = THREE.ClampToEdgeWrapping;
        tex.tireBump.anisotropy = aniso;

        tex.tireRough = new THREE.CanvasTexture(rC);
        tex.tireRough.wrapS = THREE.RepeatWrapping;
        tex.tireRough.wrapT = THREE.ClampToEdgeWrapping;
    }

    // G. Textura "Rosso Crinkle" (V12) y Lámina Térmica de Oro 24K (256x256)
    {
        const size = 256;
        const crC = document.createElement('canvas');
        const gfC = document.createElement('canvas');
        crC.width = crC.height = gfC.width = gfC.height = size;
        const crCtx = crC.getContext('2d');
        const gfCtx = gfC.getContext('2d');

        const crImg = crCtx.createImageData(size, size);
        let seed = 6619;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        for (let i = 0; i < size * size; i++) {
            const v = Math.round(75 + rand() * 140);
            const p = i * 4;
            crImg.data[p] = crImg.data[p + 1] = crImg.data[p + 2] = v;
            crImg.data[p + 3] = 255;
        }
        crCtx.putImageData(crImg, 0, 0);

        gfCtx.fillStyle = '#808080';
        gfCtx.fillRect(0, 0, size, size);
        for (let i = 0; i < 360; i++) {
            const x = rand() * size;
            const y = rand() * size;
            const r = 6 + rand() * 16;
            gfCtx.beginPath();
            gfCtx.moveTo(x, y);
            gfCtx.lineTo(x + (rand() - 0.5) * r * 2, y + (rand() - 0.5) * r * 2);
            gfCtx.lineTo(x + (rand() - 0.5) * r * 2, y + (rand() - 0.5) * r * 2);
            gfCtx.closePath();
            const v = Math.round(50 + rand() * 175);
            gfCtx.fillStyle = `rgb(${v},${v},${v})`;
            gfCtx.fill();
        }

        tex.crinkleBump = new THREE.CanvasTexture(crC);
        tex.crinkleBump.wrapS = tex.crinkleBump.wrapT = THREE.RepeatWrapping;
        tex.crinkleBump.repeat.set(8, 8);

        tex.goldFoilBump = new THREE.CanvasTexture(gfC);
        tex.goldFoilBump.wrapS = tex.goldFoilBump.wrapT = THREE.RepeatWrapping;
        tex.goldFoilBump.repeat.set(5, 5);
    }

    // H. Cuadro Digital OLED Curvo (Cabina, 512x256)
    {
        const w = 512, h = 256;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#050609';
        ctx.fillRect(0, 0, w, h);

        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.64, 82, Math.PI * 1.08, Math.PI * 1.92);
        ctx.strokeStyle = '#ff2236';
        ctx.lineWidth = 8;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.64, 66, Math.PI * 1.15, Math.PI * 1.82);
        ctx.strokeStyle = '#d8e8ff';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        for (let i = 0; i < 6; i++) {
            ctx.fillStyle = i > 3 ? '#ff2436' : '#36baff';
            ctx.fillRect(58, 172 - i * 18, 40, 7);
            ctx.fillRect(w - 98, 172 - i * 18, 40, 7);
        }

        tex.clusterMap = new THREE.CanvasTexture(c);
        tex.clusterMap.colorSpace = THREE.SRGBColorSpace;
    }

    // I. Sombra Radial Multicapa en el Suelo (512x512)
    {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, size, size);

        const drawEllipse = (cx, cy, rx, ry, alpha) => {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(rx, ry);
            const g = ctx.createRadialGradient(0, 0, 0.05, 0, 0, 1.0);
            g.addColorStop(0.0, `rgba(0,0,0,${alpha})`);
            g.addColorStop(0.45, `rgba(0,0,0,${(alpha * 0.70).toFixed(3)})`);
            g.addColorStop(0.76, `rgba(0,0,0,${(alpha * 0.20).toFixed(3)})`);
            g.addColorStop(1.0, 'rgba(0,0,0,0.0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        };

        drawEllipse(256, 256, 162, 218, 0.86);
        drawEllipse(256, 256, 118, 176, 0.92);
        drawEllipse(256 - 72, 256 + 104, 36, 48, 0.96);
        drawEllipse(256 + 72, 256 + 104, 36, 48, 0.96);
        drawEllipse(256 - 76, 256 - 102, 42, 52, 0.96);
        drawEllipse(256 + 76, 256 - 102, 42, 52, 0.96);

        tex.shadowMap = new THREE.CanvasTexture(c);
    }

    return tex;
}

function createGaussianSoftboxTexture(coreHex, edgeHex) {
    const w = 256, h = 128;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, h);

    const core = new THREE.Color(coreHex);
    const edge = new THREE.Color(edgeHex);

    for (let y = 0; y < h; y++) {
        const ny = (y / (h - 1)) * 2 - 1;
        const fy = Math.exp(-3.2 * ny * ny) * Math.pow(Math.cos(ny * Math.PI * 0.5), 1.2);
        for (let x = 0; x < w; x++) {
            const nx = (x / (w - 1)) * 2 - 1;
            const fx = Math.pow(Math.cos(nx * Math.PI * 0.5), 0.85);
            const f = clamp(fx * fy, 0, 1);

            const r = lerp(edge.r, core.r, f) * f;
            const g = lerp(edge.g, core.g, f) * f;
            const b = lerp(edge.b, core.b, f) * f;

            const p = (y * w + x) * 4;
            img.data[p] = clamp(Math.round(r * 255), 0, 255);
            img.data[p + 1] = clamp(Math.round(g * 255), 0, 255);
            img.data[p + 2] = clamp(Math.round(b * 255), 0, 255);
            img.data[p + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
}

function createAutomotiveStudioEnv(renderer) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color('#050608');

    const warmTex = createGaussianSoftboxTexture('#fff8f0', '#3c3632');
    const neutralTex = createGaussianSoftboxTexture('#f7faff', '#303642');
    const coolTex = createGaussianSoftboxTexture('#d4e6ff', '#25344b');

    const addSoftbox = (evalFn, texture, intensity, uSegs = 20, vSegs = 6) => {
        const geo = buildParametricSurface(uSegs, vSegs, evalFn);
        const mat = new THREE.MeshBasicMaterial({
            map: texture,
            color: new THREE.Color(intensity, intensity, intensity),
            side: THREE.DoubleSide
        });
        envScene.add(new THREE.Mesh(geo, mat));
    };

    // Softbox cenital principal
    addSoftbox((u, v) => {
        const z = lerp(-12, 12, u);
        const x = lerp(-2.2, 2.8, v);
        const y = 8.6 - 0.016 * z * z;
        return [x, y, z];
    }, neutralTex, 2.05);

    // Bandas laterales de línea de cintura
    [-1, 1].forEach(side => {
        addSoftbox((u, v) => {
            const z = lerp(-12, 12, u);
            const y = lerp(0.75, 1.95, v);
            const x = side * (9.6 - 0.012 * z * z);
            return [x, y, z];
        }, side > 0 ? warmTex : coolTex, 1.42);
    });

    // Arcos de hombro 45°
    [-1, 1].forEach(side => {
        addSoftbox((u, v) => {
            const z = lerp(-11, 11, u);
            const ang = lerp(0.54, 0.90, v) * side;
            const r = 8.8;
            return [Math.sin(ang) * r, Math.cos(ang) * r, z];
        }, side > 0 ? warmTex : neutralTex, 1.48);
    });

    // Softbox frontal y trasero suaves
    addSoftbox((u, v) => {
        const ang = lerp(-0.95, 1.15, u);
        const y = lerp(2.0, 5.6, v);
        const r = 9.5;
        return [Math.sin(ang) * r, y, Math.cos(ang) * r];
    }, warmTex, 1.38);

    addSoftbox((u, v) => {
        const ang = lerp(-1.10, 1.05, u);
        const y = lerp(2.0, 5.4, v);
        const r = 9.2;
        return [Math.sin(ang) * r, y, -Math.cos(ang) * r];
    }, coolTex, 1.22);

    // Anillo rasante sutil para definir neumáticos y difusor
    addSoftbox((u, v) => {
        const a = u * Math.PI * 2;
        const y = lerp(-0.4, 0.55, v);
        const r = 10.5;
        return [Math.cos(a) * r, y, Math.sin(a) * r];
    }, neutralTex, 0.45, 32, 4);

    const envRT = pmrem.fromScene(envScene, 0.032);
    pmrem.dispose();
    return envRT.texture;
}
