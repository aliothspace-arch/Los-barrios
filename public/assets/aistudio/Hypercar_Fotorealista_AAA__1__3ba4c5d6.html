// 4. ARQUITECTURA CLASE-A CONTINUA DEL HYPERCAR + ACTUADORES HIDRÁULICOS
// ============================================================================

/**
 * Evaluador matemático continuo C2 del frontal (morro, capó, aletas estilizadas y S-duct).
 */
function createFrontSurfaceEvaluator() {
    const TH_START = Math.PI + 0.5359;
    const TH_END = -0.5419;
    const U_ARCH_0 = 0.17;
    const U_ARCH_1 = 0.73;

    const U_FRUNK_0 = 0.170;
    const U_FRUNK_1 = 0.750;
    const vFrunkSeam = (u) => {
        const t = clamp((u - U_FRUNK_0) / (U_FRUNK_1 - U_FRUNK_0), 0, 1);
        return lerp(0.435, 0.365, smoothstep(0, 1, t));
    };

    const evalHoodCenterY = (z) => {
        const tBack = clamp((2.32 - z) / (2.32 - 0.68), 0, 1);
        return 0.295 + 0.448 * (1.0 - Math.pow(1.0 - tBack, 3.10));
    };

    const headlightMask = (u, v) => {
        const du = (u - 0.850) / 0.072;
        const dv = (v - 0.540) / 0.112;
        const rx = du * 0.86 + dv * 0.51;
        const ry = -du * 0.51 + dv * 0.86;
        const d = Math.hypot(rx * 0.88, ry * 1.48);
        return 1.0 - smootherstep(0.58, 1.0, d);
    };

    const evalBase = (u, v, includeHeadlightPocket = true) => {
        const zCenter = lerp(0.68, 2.32, u);

        let zLip, yLip, xLip;
        if (u < U_ARCH_0) {
            const k = u / U_ARCH_0;
            const zBackBot = SPEC.fZ + Math.cos(TH_START) * SPEC.fArchR;
            zLip = lerp(0.68, zBackBot, k);
            yLip = lerp(0.155, 0.150, k);
            xLip = lerp(0.895, 0.985, smoothstep(0.0, 1.0, k));
        } else if (u <= U_ARCH_1) {
            const k = (u - U_ARCH_0) / (U_ARCH_1 - U_ARCH_0);
            const th = lerp(TH_START, TH_END, k);
            const cosT = Math.cos(th);
            const sinT = Math.sin(th);
            zLip = SPEC.fZ + cosT * SPEC.fArchR;
            yLip = SPEC.fR + sinT * SPEC.fArchR;
            xLip = 1.006 - 0.024 * Math.pow(Math.abs(cosT), 1.7) - 0.012 * Math.max(0, -sinT);
        } else {
            const k = (u - U_ARCH_1) / (1.0 - U_ARCH_1);
            const zFrontBot = SPEC.fZ + Math.cos(TH_END) * SPEC.fArchR;
            const bow = Math.sin(k * Math.PI * 0.5);
            zLip = lerp(zFrontBot, 2.315, Math.pow(k, 0.88));
            xLip = lerp(0.982, 0.0, Math.pow(k, 1.55)) * (1.0 - 0.06 * bow);
            yLip = lerp(0.148, 0.256, smoothstep(0.05, 1.0, k)) + 0.014 * Math.sin(k * Math.PI);
        }

        const vNorm = Math.min(v / 0.90, 1.0);
        const z = lerp(zCenter, zLip, smootherstep(0.32, 0.92, vNorm));
        const yCenter = evalHoodCenterY(z);

        const archInfluence = gauss(z, SPEC.fZ, 0.44);
        const noseTaper = 1.0 - Math.pow(smoothstep(1.68, 2.32, z), 1.80);
        const xShoulder = Math.max(xLip, (0.945 + 0.062 * archInfluence) * (0.04 + 0.96 * noseTaper));

        let x, y;
        if (v <= 0.72) {
            const s = v / 0.72;
            x = Math.min(xLip, xShoulder) * Math.pow(s, 0.96);
            if (u > U_ARCH_1) {
                const kNose = (u - U_ARCH_1) / (1.0 - U_ARCH_1);
                x = lerp(x, xLip * s, smoothstep(0.55, 1.0, kNose));
            }

            // Aletas bajas, tensas y aerodinámicas sobre el paso de rueda (sin protuberancias)
            const wheelSwell = 0.062 * gauss(z, SPEC.fZ - 0.02, 0.56) * smoothstep(2.28, 1.84, z) * smoothstep(0.66, 0.98, z);
            const shoulderLead = 0.014 * smoothstep(0.68, 0.86, z) * smoothstep(1.55, 0.92, z);
            const yFenderBase = yCenter + wheelSwell + shoulderLead;
            const yShoulder = Math.max(yLip + 0.048, yFenderBase);

            const hoodCrown = 0.016 * (1.0 - s * s) * smoothstep(2.30, 1.95, z);
            const centerSpine = 0.005 * gauss(s, 0.0, 0.15) * smoothstep(0.75, 1.25, z) * smoothstep(2.28, 1.98, z);
            const subtleFenderCrown = 0.010 * Math.sin(smoothstep(0.32, 1.0, s) * Math.PI) * gauss(z, SPEC.fZ, 0.48) * smoothstep(2.24, 1.78, z);

            y = lerp(yCenter + hoodCrown + centerSpine, yShoulder, smootherstep(0.18, 0.94, s)) + subtleFenderCrown;

            const sdZ = smootherstep(1.38, 1.50, z) * (1.0 - smootherstep(1.74, 1.85, z));
            const sdX = 1.0 - smootherstep(0.14, 0.25, x);
            const sDuctDrop = -0.046 * sdZ * sdX;
            const sDuctRim = 0.006 * sdZ * gauss(x, 0.24, 0.050);
            y += sDuctDrop + sDuctRim;

            const noseRoll = -0.026 * Math.pow(smoothstep(0.91, 1.0, u), 2.0);
            y += noseRoll;
        } else if (v <= 0.90) {
            const st = (v - 0.72) / 0.18;
            const topP = evalBase(u, 0.72, false);
            const bulge = Math.sin(st * Math.PI) * 0.022 * smoothstep(0.98, 0.76, u);
            x = lerp(topP[0], xLip, smootherstep(0.0, 1.0, st)) + bulge;
            y = lerp(topP[1], yLip, Math.pow(st, 1.08));

            if (u < U_ARCH_0) {
                const bk = 1.0 - smoothstep(0.0, U_ARCH_0, u);
                const midV = Math.sin(st * Math.PI);
                x -= 0.052 * bk * midV;
            }
        } else {
            const lt = (v - 0.90) / 0.10;
            const lipP = evalBase(u, 0.90, false);
            const rollIn = 0.036 * smootherstep(0, 1, lt);
            let dzRoll = 0, dyRoll = -0.006 * lt;
            if (u >= U_ARCH_0 && u <= U_ARCH_1) {
                const k = (u - U_ARCH_0) / (U_ARCH_1 - U_ARCH_0);
                const th = lerp(TH_START, TH_END, k);
                dzRoll = -Math.cos(th) * 0.005 * lt;
                dyRoll = -Math.sin(th) * 0.005 * lt;
            }
            x = Math.max(0.0, lipP[0] - rollIn);
            y = lipP[1] + dyRoll;
            return [x, y, lipP[2] + dzRoll];
        }

        if (includeHeadlightPocket && v < 0.76 && u > 0.72 && u < 0.96) {
            const hm = headlightMask(u, v);
            if (hm > 0.001) {
                y -= 0.030 * hm;
            }
        }

        return [Math.max(0.0, x), y, z];
    };

    const evalNormal = (u, v, includeHeadlightPocket = false) => {
        const eps = 0.003;
        const u0 = clamp(u - eps, 0, 1), u1 = clamp(u + eps, 0, 1);
        const v0 = clamp(v - eps, 0, 0.995), v1 = clamp(v + eps, 0, 0.995);
        const pu0 = evalBase(u0, v, includeHeadlightPocket);
        const pu1 = evalBase(u1, v, includeHeadlightPocket);
        const pv0 = evalBase(u, v0, includeHeadlightPocket);
        const pv1 = evalBase(u, v1, includeHeadlightPocket);
        const du = new THREE.Vector3(pu1[0] - pu0[0], pu1[1] - pu0[1], pu1[2] - pu0[2]);
        const dv = new THREE.Vector3(pv1[0] - pv0[0], pv1[1] - pv0[1], pv1[2] - pv0[2]);
        const n = du.cross(dv);
        if (n.lengthSq() < 1e-10) return new THREE.Vector3(0, 1, 0);
        n.normalize();
        if (v < 0.002) {
            n.x = 0;
            if (n.lengthSq() > 1e-10) n.normalize();
            else n.set(0, 1, 0);
        }
        return n;
    };

    const evalFlushNormal = (u, v) => evalNormal(u, v, false);

    return {
        evalBase,
        evalNormal,
        evalFlushNormal,
        evalHoodCenterY,
        headlightMask,
        U_FRUNK_0,
        U_FRUNK_1,
        vFrunkSeam
    };
}

/**
 * Amortiguador hidráulico telescópico de dos piezas con salvaguarda de orientación anti-NaN.
 */
function createHydraulicStrut(parentGroup, mat, cylLen, rodLen, cylR = 0.009, rodR = 0.0045) {
    const upAxis = new THREE.Vector3(0, 1, 0);

    const cylGeo = new THREE.LatheGeometry([
        new THREE.Vector2(0.0005, 0.000),
        new THREE.Vector2(cylR * 0.85, 0.006),
        new THREE.Vector2(cylR * 0.72, 0.016),
        new THREE.Vector2(cylR, 0.024),
        new THREE.Vector2(cylR, cylLen - 0.014),
        new THREE.Vector2(cylR * 0.82, cylLen - 0.004),
        new THREE.Vector2(rodR * 1.18, cylLen),
        new THREE.Vector2(rodR * 1.05, cylLen - 0.005)
    ], 14);
    const cylMesh = new THREE.Mesh(cylGeo, mat.matteCarbon);

    const collarGeo = new THREE.LatheGeometry([
        new THREE.Vector2(rodR * 1.08, cylLen - 0.012),
        new THREE.Vector2(cylR * 1.05, cylLen - 0.010),
        new THREE.Vector2(cylR * 1.02, cylLen + 0.003),
        new THREE.Vector2(rodR * 1.12, cylLen + 0.004)
    ], 14);
    cylMesh.add(new THREE.Mesh(collarGeo, mat.machinedAlu));

    const rodGeo = new THREE.LatheGeometry([
        new THREE.Vector2(0.0005, 0.000),
        new THREE.Vector2(cylR * 0.78, 0.006),
        new THREE.Vector2(rodR * 1.15, 0.016),
        new THREE.Vector2(rodR, 0.024),
        new THREE.Vector2(rodR, rodLen),
        new THREE.Vector2(0.0005, rodLen + 0.003)
    ], 12);
    const rodMesh = new THREE.Mesh(rodGeo, mat.machinedAlu);

    parentGroup.add(cylMesh);
    parentGroup.add(rodMesh);

    const pA = new THREE.Vector3();
    const pB = new THREE.Vector3();
    const dir = new THREE.Vector3();
    const negDir = new THREE.Vector3();

    const safeAlign = (mesh, v) => {
        const dot = clamp(upAxis.dot(v), -1, 1);
        if (dot < -0.9999) {
            mesh.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI);
        } else {
            mesh.quaternion.setFromUnitVectors(upAxis, v);
        }
    };

    return {
        cylMesh,
        rodMesh,
        update(anchorObjA, anchorObjB, spaceParent) {
            anchorObjA.getWorldPosition(pA);
            anchorObjB.getWorldPosition(pB);
            spaceParent.worldToLocal(pA);
            spaceParent.worldToLocal(pB);

            dir.subVectors(pB, pA);
            const len = dir.length();
            if (!Number.isFinite(len) || len < 1e-4) return;
            dir.divideScalar(len);
            negDir.copy(dir).negate();

            cylMesh.position.copy(pA);
            safeAlign(cylMesh, dir);

            rodMesh.position.copy(pB);
            safeAlign(rodMesh, negDir);
        }
    };
}

function tagInteractive(obj, partName) {
    obj.traverse(child => {
        if (child.isMesh) {
            child.userData.interactivePart = partName;
        }
    });
}

/**
 * 4.1 Monocasco Interno, Fondo Plano Venturi y Pasos de Rueda Retranqueados
 */
function buildChassisAndWheelWells(car, mat) {
    const group = new THREE.Group();

    const floorGeo = buildParametricSurface(44, 20, (u, v) => {
        const z = lerp(-2.22, 2.24, u);
        const s = (v - 0.5) * 2;
        let halfW = 0.82;
        if (z > 0.86) halfW = lerp(0.82, 0.52, smoothstep(0.86, 2.24, z));
        if (z < -0.82) halfW = lerp(0.82, 0.64, smoothstep(-0.82, -2.22, z));

        const fCut = gauss(z, SPEC.fZ, 0.34) * 0.24;
        const rCut = gauss(z, SPEC.rZ, 0.38) * 0.22;
        halfW = Math.max(0.52, halfW - fCut - rCut);

        let y = 0.118;
        if (z < -1.46) {
            const rt = smoothstep(-1.46, -2.22, z);
            y = 0.118 + rt * rt * 0.24 * (1 - 0.2 * s * s);
        }
        return [s * halfW, y, z];
    }, { worldUV: true, uvScaleU: 1.5, uvScaleV: 1.5, flipWinding: true });
    const floorMesh = new THREE.Mesh(floorGeo, mat.carbon);
    floorMesh.receiveShadow = true;
    group.add(floorMesh);

    const coreGeo = buildParametricSurface(38, 18, (u, v) => {
        const z = lerp(-2.06, 2.02, u);
        const ang = v * Math.PI;
        const cosA = Math.cos(ang);
        const sinA = Math.sin(ang);

        let rx = 0.58;
        if (z > 0.80) rx = lerp(0.58, 0.38, smoothstep(0.80, 2.02, z));
        else if (z < -0.80) rx = lerp(0.58, 0.54, smoothstep(-0.80, -2.06, z));

        let topY = 0.50;
        if (z > 0.80) topY = lerp(0.52, 0.24, smoothstep(0.80, 2.02, z));
        else if (z < -0.68) topY = lerp(0.68, 0.58, smoothstep(-0.68, -2.06, z));

        const frunkDip = smootherstep(0.88, 1.00, z) * (1.0 - smootherstep(1.86, 1.98, z));
        topY = lerp(topY, 0.215, frunkDip);

        return [cosA * rx, lerp(0.13, topY, Math.pow(sinA, 0.85)), z];
    }, { flipWinding: false });
    group.add(new THREE.Mesh(coreGeo, mat.voidBlack));

    const makeRecessedWheelWell = (axleZ, centerY, archR, innerX, outerX) => {
        const linerR = archR - 0.015;
        const archGeo = buildParametricSurface(32, 8, (u, v) => {
            const th = lerp(Math.PI + 0.42, -0.42, u);
            const x = lerp(innerX, outerX, v);
            const r = linerR - 0.004 * v;
            const z = axleZ + Math.cos(th) * r;
            const y = Math.max(0.12, centerY + Math.sin(th) * r);
            return [x, y, z];
        }, { flipWinding: false });
        addMirroredMesh(group, archGeo, mat.matteCarbon, false, true);

        const backGeo = buildParametricSurface(24, 6, (u, v) => {
            const th = lerp(Math.PI + 0.42, -0.42, u);
            const r = lerp(0.04, linerR, v);
            return [innerX, Math.max(0.12, centerY + Math.sin(th) * r), axleZ + Math.cos(th) * r];
        }, { flipWinding: true });
        addMirroredMesh(group, backGeo, mat.voidBlack, false, true);
    };

    makeRecessedWheelWell(SPEC.fZ, SPEC.fR, SPEC.fArchR, 0.59, 0.958);
    makeRecessedWheelWell(SPEC.rZ, SPEC.rR, SPEC.rArchR, 0.59, 0.985);

    car.add(group);
}

/**
 * 4.2 Frontal Clase-A, Maletero Abatible (Frunk) con Bolsa y Doble Pistón, Faros y Splitter
 */
function buildFrontClipAndAero(car, mat) {
    const group = new THREE.Group();
    const frontEval = createFrontSurfaceEvaluator();
    const { U_FRUNK_0, U_FRUNK_1, vFrunkSeam } = frontEval;

    const buildFrontSubPatch = (uSegs, vSegs, uvMapFn, includePocket, forceSeamX0 = false) => {
        const geo = buildParametricSurface(uSegs, vSegs, (u, v) => {
            const [uu, vv] = uvMapFn(u, v);
            return frontEval.evalBase(uu, vv, includePocket);
        }, {
            worldUV: true,
            uvScaleU: 1.0,
            uvScaleV: 1.0,
            flipWinding: false,
            forceSymmetrySeamX0: forceSeamX0
        });

        const norm = geo.attributes.normal;
        const vCount = vSegs + 1;
        for (let iu = 0; iu <= uSegs; iu++) {
            const u = iu / uSegs;
            for (let iv = 0; iv <= vSegs; iv++) {
                const v = iv / vSegs;
                const [uu, vv] = uvMapFn(u, v);
                const n = frontEval.evalNormal(uu, vv, includePocket);
                const idx = iu * vCount + iv;
                norm.setXYZ(idx, n.x, n.y, n.z);
            }
        }
        norm.needsUpdate = true;
        return geo;
    };

    const gapU = 0.0022;
    const gapV = 0.0040;

    // 1. Torpedo trasero fijo
    const cowlStripGeo = buildFrontSubPatch(14, 40, (u, v) => [
        lerp(0.0, U_FRUNK_0 - gapU, u),
        v
    ], false, true);
    addMirroredMesh(group, cowlStripGeo, mat.paint, true, true);

    // 2. Morro delantero fijo con cavidades de faros
    const noseCapGeo = buildFrontSubPatch(22, 42, (u, v) => [
        lerp(U_FRUNK_1 + gapU, 1.0, u),
        v
    ], true, true);
    addMirroredMesh(group, noseCapGeo, mat.paint, true, true);

    // 3. Aletas exteriores fijas
    const outerFenderGeo = buildFrontSubPatch(38, 30, (u, v) => {
        const uu = lerp(U_FRUNK_0 - gapU, U_FRUNK_1 + gapU, u);
        const vv = lerp(vFrunkSeam(uu) + gapV, 1.0, v);
        return [uu, vv];
    }, false, false);
    addMirroredMesh(group, outerFenderGeo, mat.paint, true, true);

    // Junta de goma perimetral del maletero
    const gutterPts = [];
    for (let i = 0; i <= 14; i++) {
        const uu = lerp(U_FRUNK_0, U_FRUNK_1, i / 14);
        const p = frontEval.evalBase(uu, vFrunkSeam(uu), false);
        gutterPts.push([p[0] - 0.004, p[1] - 0.011, p[2]]);
    }
    addMirroredMesh(group, buildVariableTube(gutterPts, [0.010, 0.007], 24, 10), mat.voidBlack, false, true);

    // B. TAPA ABATIBLE DEL MALETERO DELANTERO (FRUNK)
    const zHinge = lerp(0.68, 2.32, U_FRUNK_0);
    const yHinge = frontEval.evalHoodCenterY(zHinge) - 0.014;

    const frunkPivot = new THREE.Group();
    frunkPivot.position.set(0, yHinge, zHinge);
    group.add(frunkPivot);

    const frunkContent = new THREE.Group();
    frunkContent.position.set(0, -yHinge, -zHinge);
    frunkPivot.add(frunkContent);

    const frunkOuterGeo = buildFrontSubPatch(36, 22, (u, v) => {
        const uu = lerp(U_FRUNK_0 + gapU, U_FRUNK_1 - gapU, u);
        const vv = lerp(0.0, vFrunkSeam(uu) - gapV, v);
        return [uu, vv];
    }, false, true);
    addMirroredMesh(frunkContent, frunkOuterGeo, mat.paint, true, true);

    const frunkInnerGeo = buildParametricSurface(24, 16, (u, v) => {
        const uu = lerp(U_FRUNK_0 + gapU + 0.01, U_FRUNK_1 - gapU - 0.01, u);
        const vv = lerp(0.0, vFrunkSeam(uu) - gapV - 0.015, v);
        const p = frontEval.evalBase(uu, vv, false);
        const n = frontEval.evalNormal(uu, vv, false);
        const edgeFade = smoothstep(0.0, 0.14, u) * smoothstep(1.0, 0.86, u) * smoothstep(1.0, 0.84, v);
        const thick = lerp(0.007, 0.018, edgeFade);
        return [p[0] - n.x * thick, p[1] - n.y * thick, p[2] - n.z * thick];
    }, { worldUV: true, flipWinding: true, forceSymmetrySeamX0: true });
    addMirroredMesh(frunkContent, frunkInnerGeo, mat.carbon, false, true);

    const lidRibPts = [];
    for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        const uu = lerp(U_FRUNK_0 + 0.04, U_FRUNK_1 - 0.04, t);
        const vv = lerp(0.04, vFrunkSeam(uu) - 0.05, t);
        const p = frontEval.evalBase(uu, vv, false);
        lidRibPts.push([p[0], p[1] - 0.021, p[2]]);
    }
    addMirroredMesh(frunkContent, buildVariableTube(lidRibPts, [0.012, 0.007], 18, 10, { worldUV: true }), mat.carbon, false, true);

    const frontLatchY = frontEval.evalHoodCenterY(1.86) - 0.018;
    frunkContent.add(new THREE.Mesh(buildVariableTube([
        [-0.022, frontLatchY, 1.855],
        [-0.016, frontLatchY - 0.026, 1.865],
        [0.016, frontLatchY - 0.026, 1.865],
        [0.022, frontLatchY, 1.855]
    ], 0.0042, 14, 8), mat.machinedAlu));

    // S-Duct integrado en la tapa del maletero
    const sdFramePts = [
        [0.00, frontEval.evalHoodCenterY(1.83) + 0.003, 1.83],
        [0.13, frontEval.evalHoodCenterY(1.81) + 0.001, 1.81],
        [0.19, frontEval.evalHoodCenterY(1.68) - 0.002, 1.68],
        [0.20, frontEval.evalHoodCenterY(1.48) + 0.002, 1.48],
        [0.13, frontEval.evalHoodCenterY(1.41) + 0.006, 1.41],
        [0.00, frontEval.evalHoodCenterY(1.40) + 0.009, 1.40]
    ];
    addMirroredMesh(frunkContent, buildVariableTube(sdFramePts, [0.009, 0.006], 24, 10, { worldUV: true }), mat.carbon);

    const sdVaneY = frontEval.evalHoodCenterY(1.64) - 0.019;
    const sdVaneGeo = buildSculptedAirfoil(18, 10, u => {
        const s = (u - 0.5) * 2;
        return {
            x: s * 0.17,
            y: sdVaneY + 0.006 * (1 - s * s),
            z: 1.64 - 0.016 * s * s,
            chord: 0.068,
            thickness: 0.13,
            camber: 0.03,
            pitch: 0.16,
            roll: 0
        };
    });
    frunkContent.add(new THREE.Mesh(sdVaneGeo, mat.carbon));

    const frunkLidAnchorL = new THREE.Object3D();
    frunkLidAnchorL.position.set(0.41, frontEval.evalHoodCenterY(1.24) - 0.022, 1.24);
    frunkContent.add(frunkLidAnchorL);

    const frunkLidAnchorR = new THREE.Object3D();
    frunkLidAnchorR.position.set(-0.41, frontEval.evalHoodCenterY(1.24) - 0.022, 1.24);
    frunkContent.add(frunkLidAnchorR);

    tagInteractive(frunkPivot, 'frunk');

    // C. COMPARTIMENTO DE EQUIPAJE DELANTERO (CARBONO + ALCANTARA + BOLSA WEEKENDER)
    const frunkBay = new THREE.Group();

    const tubWallGeo = buildParametricSurface(24, 14, (u, v) => {
        const a = u * Math.PI * 2;
        const cosA = Math.cos(a);
        const sinA = Math.sin(a);
        const sx = Math.sign(cosA) * Math.pow(Math.abs(cosA), 0.72);
        const sz = Math.sign(sinA) * Math.pow(Math.abs(sinA), 0.72);
        const z = 1.43 + sz * 0.42;
        const topW = lerp(0.47, 0.37, smoothstep(1.00, 1.86, z));
        const botW = topW - 0.08;
        const x = sx * lerp(topW, botW, v);
        const yTop = frontEval.evalHoodCenterY(z) - 0.022;
        const yBot = 0.242;
        const y = lerp(yTop, yBot, Math.pow(v, 0.88));
        return [x, y, z];
    }, { closedU: true, worldUV: true, flipWinding: true });
    frunkBay.add(new THREE.Mesh(tubWallGeo, mat.carbon));

    const bayFloorGeo = buildParametricSurface(14, 14, (u, v) => {
        const s = (v - 0.5) * 2;
        const z = lerp(1.07, 1.79, u);
        const halfW = lerp(0.37, 0.28, u);
        const edgeCurve = Math.sin(u * Math.PI);
        return [s * halfW * (0.82 + 0.18 * edgeCurve), 0.245, z];
    }, { flipWinding: false });
    frunkBay.add(new THREE.Mesh(bayFloorGeo, mat.alcantara));

    const stitchPts = [];
    for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const sx = Math.sign(Math.cos(a)) * Math.pow(Math.abs(Math.cos(a)), 0.75);
        const sz = Math.sign(Math.sin(a)) * Math.pow(Math.abs(Math.sin(a)), 0.75);
        const z = 1.43 + sz * 0.34;
        const halfW = lerp(0.34, 0.26, smoothstep(1.08, 1.78, z));
        stitchPts.push([sx * halfW, 0.249, z]);
    }
    frunkBay.add(new THREE.Mesh(buildVariableTube(stitchPts, 0.0028, 32, 8, { closed: true }), mat.seatTrimRed));

    // Copelas CNC de suspensión y barra de torretas en carbono
    const strutCapGeo = new THREE.LatheGeometry([
        new THREE.Vector2(0.001, 0.000),
        new THREE.Vector2(0.056, 0.000),
        new THREE.Vector2(0.056, 0.012),
        new THREE.Vector2(0.044, 0.018),
        new THREE.Vector2(0.022, 0.020),
        new THREE.Vector2(0.018, 0.030),
        new THREE.Vector2(0.001, 0.031)
    ], 20);
    [-1, 1].forEach(side => {
        const cap = new THREE.Mesh(strutCapGeo, mat.machinedAlu);
        cap.position.set(side * 0.42, 0.56, 1.38);
        frunkBay.add(cap);

        const nut = new THREE.Mesh(new THREE.LatheGeometry([
            new THREE.Vector2(0.001, 0.030),
            new THREE.Vector2(0.012, 0.030),
            new THREE.Vector2(0.011, 0.039),
            new THREE.Vector2(0.001, 0.040)
        ], 12), mat.anodizedRed);
        nut.position.set(side * 0.42, 0.56, 1.38);
        frunkBay.add(nut);
    });

    frunkBay.add(new THREE.Mesh(buildVariableTube([
        [-0.44, 0.595, 1.05],
        [-0.22, 0.612, 1.03],
        [0.00, 0.618, 1.025],
        [0.22, 0.612, 1.03],
        [0.44, 0.595, 1.05]
    ], [0.014, 0.011], 22, 10, { worldUV: true }), mat.carbon));

    // Bolsa Weekender esculpida en Alcantara, fibra de carbono y asas rojas
    const duffelGroup = new THREE.Group();
    const duffelStations = [];
    for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        const x = lerp(-0.245, 0.245, t);
        const endRound = Math.max(0.08, Math.pow(Math.sin(t * Math.PI), 0.34));
        const halfZ = 0.145 * endRound;
        const h = 0.165 * endRound;
        const pts = [];
        for (let k = 0; k < 12; k++) {
            const a = (k / 12) * Math.PI * 2;
            const cz = Math.cos(a);
            const sy = Math.sin(a);
            const pz = 1.48 + cz * halfZ * (1.0 - 0.14 * Math.max(0, sy));
            const py = 0.252 + (sy * 0.5 + 0.5) * h + 0.010 * (1 - cz * cz) * Math.max(0, sy);
            pts.push([x, py, pz]);
        }
        duffelStations.push(pts);
    }
    const duffelMesh = new THREE.Mesh(buildSplineLoft(duffelStations, 24, 18, { closedV: true, worldUV: true }), mat.alcantara);
    duffelMesh.castShadow = true;
    duffelGroup.add(duffelMesh);

    [-0.13, 0.13].forEach(bx => {
        const strapPts = [];
        for (let k = 0; k < 18; k++) {
            const a = (k / 18) * Math.PI * 2;
            const cz = Math.cos(a);
            const sy = Math.sin(a);
            strapPts.push([bx, 0.252 + (sy * 0.5 + 0.5) * 0.168, 1.48 + cz * 0.146 * (1.0 - 0.14 * Math.max(0, sy))]);
        }
        duffelGroup.add(new THREE.Mesh(buildVariableTube(strapPts, [0.014, 0.0045], 24, 8, { closed: true, worldUV: true }), mat.carbon));
    });

    duffelGroup.add(new THREE.Mesh(buildVariableTube([
        [-0.20, 0.416, 1.48], [0, 0.424, 1.48], [0.20, 0.416, 1.48]
    ], [0.004, 0.003], 12, 8), mat.machinedAlu));

    [-1, 1].forEach(side => {
        duffelGroup.add(new THREE.Mesh(buildVariableTube([
            [-0.10, 0.405, 1.48 + side * 0.055],
            [-0.06, 0.468, 1.48 + side * 0.042],
            [0.00, 0.482, 1.48 + side * 0.036],
            [0.06, 0.468, 1.48 + side * 0.042],
            [0.10, 0.405, 1.48 + side * 0.055]
        ], 0.0065, 18, 8), mat.seatTrimRed));
    });
    frunkBay.add(duffelGroup);

    const frunkLedMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color('#fff5e6'),
        emissive: new THREE.Color('#ffeed4'),
        emissiveIntensity: 0.0,
        roughness: 0.2,
        toneMapped: false
    });
    frunkBay.add(new THREE.Mesh(buildVariableTube([
        [-0.22, 0.565, 1.07],
        [0.00, 0.575, 1.06],
        [0.22, 0.565, 1.07]
    ], [0.004, 0.003], 14, 8), frunkLedMat));

    const frunkLight = new THREE.PointLight(0xffedd2, 0.0, 1.35, 2.0);
    frunkLight.position.set(0, 0.56, 1.38);
    frunkBay.add(frunkLight);

    const frunkChassisAnchorL = new THREE.Object3D();
    frunkChassisAnchorL.position.set(0.43, 0.54, 1.44);
    frunkBay.add(frunkChassisAnchorL);

    const frunkChassisAnchorR = new THREE.Object3D();
    frunkChassisAnchorR.position.set(-0.43, 0.54, 1.44);
    frunkBay.add(frunkChassisAnchorR);

    group.add(frunkBay);

    const frunkStrutL = createHydraulicStrut(group, mat, 0.215, 0.220, 0.0085, 0.0042);
    const frunkStrutR = createHydraulicStrut(group, mat, 0.215, 0.220, 0.0085, 0.0042);

    // D. FAROS EMPOTRADOS CONFORMALES A LA ALETA
    const buildConformalHeadlights = () => {
        const almondUV = (a, r) => {
            const cx = Math.cos(a) * r / 0.88;
            const cy = Math.sin(a) * r / 1.48;
            const du = (cx * 0.86 - cy * 0.51) * 0.072;
            const dv = (cx * 0.51 + cy * 0.86) * 0.112;
            return [0.850 + du, 0.540 + dv];
        };

        const bowlGeo = buildParametricSurface(28, 10, (ua, vr) => {
            const a = ua * Math.PI * 2;
            const r = lerp(0.02, 0.90, vr);
            const [fu, fv] = almondUV(a, r);
            const p = frontEval.evalBase(fu, fv, false);
            const n = frontEval.evalFlushNormal(fu, fv);
            const depth = 0.029 * (1.0 - 0.55 * vr * vr);
            return [p[0] - n.x * depth, p[1] - n.y * depth, p[2] - n.z * depth];
        }, { closedU: true, flipWinding: true });
        addMirroredMesh(group, bowlGeo, mat.opticGunmetal, false, true);

        const rimPts = [];
        for (let i = 0; i < 32; i++) {
            const a = (i / 32) * Math.PI * 2;
            const [fu, fv] = almondUV(a, 0.94);
            const p = frontEval.evalBase(fu, fv, false);
            const n = frontEval.evalFlushNormal(fu, fv);
            rimPts.push([p[0] - n.x * 0.002, p[1] - n.y * 0.002, p[2] - n.z * 0.002]);
        }
        addMirroredMesh(group, buildVariableTube(rimPts, [0.0048, 0.0042], 40, 8, { closed: true, worldUV: true }), mat.carbon, false, true);

        const shroudGeo = new THREE.LatheGeometry([
            new THREE.Vector2(0.019, 0.000),
            new THREE.Vector2(0.024, 0.012),
            new THREE.Vector2(0.022, 0.026),
            new THREE.Vector2(0.017, 0.026),
            new THREE.Vector2(0.015, 0.004)
        ], 20);
        shroudGeo.rotateX(Math.PI * 0.5);

        const lensPts = [];
        for (let i = 0; i <= 8; i++) {
            const a = (i / 8) * Math.PI * 0.5;
            lensPts.push(new THREE.Vector2(Math.sin(a) * 0.018, Math.cos(a) * 0.013));
        }
        const projGlassGeo = new THREE.LatheGeometry(lensPts, 18);
        projGlassGeo.rotateX(Math.PI * 0.5);

        [-1, 1].forEach(side => {
            [
                almondUV(0.25, 0.36),
                almondUV(3.40, 0.36)
            ].forEach(([fu, fv]) => {
                const p = frontEval.evalBase(fu, fv, false);
                const n = frontEval.evalFlushNormal(fu, fv);
                const pod = new THREE.Group();
                pod.position.set(
                    side * (p[0] - n.x * 0.020),
                    p[1] - n.y * 0.020,
                    p[2] - n.z * 0.020
                );
                pod.rotation.set(0.14, side * 0.16, 0);
                pod.add(new THREE.Mesh(shroudGeo, mat.machinedAlu));
                const gLens = new THREE.Mesh(projGlassGeo, mat.headlightLens);
                gLens.position.z = 0.014;
                pod.add(gLens);
                pod.add(new THREE.Mesh(buildVariableTube([[0, 0, 0.006], [0, 0, 0.015]], 0.007, 6, 8), mat.ledWhite));
                group.add(pod);
            });
        });

        const drlPrimaryPts = [];
        for (let i = 0; i <= 16; i++) {
            const a = lerp(0.15, 3.05, i / 16);
            const [fu, fv] = almondUV(a, 0.78);
            const p = frontEval.evalBase(fu, fv, false);
            const n = frontEval.evalFlushNormal(fu, fv);
            drlPrimaryPts.push([p[0] - n.x * 0.010, p[1] - n.y * 0.010, p[2] - n.z * 0.010]);
        }
        addMirroredMesh(group, buildVariableTube(drlPrimaryPts, t => [0.0042, 0.0036 * (0.7 + 0.4 * Math.sin(t * Math.PI))], 28, 8), mat.ledWhite, false, false);

        const drlAccentPts = [];
        for (let i = 0; i <= 12; i++) {
            const a = lerp(-0.35, -2.55, i / 12);
            const [fu, fv] = almondUV(a, 0.74);
            const p = frontEval.evalBase(fu, fv, false);
            const n = frontEval.evalFlushNormal(fu, fv);
            drlAccentPts.push([p[0] - n.x * 0.012, p[1] - n.y * 0.012, p[2] - n.z * 0.012]);
        }
        addMirroredMesh(group, buildVariableTube(drlAccentPts, [0.0032, 0.0028], 20, 8), mat.ledWhite, false, false);

        const coverGeo = buildParametricSurface(28, 8, (ua, vr) => {
            const a = ua * Math.PI * 2;
            const r = lerp(0.01, 0.94, vr);
            const [fu, fv] = almondUV(a, r);
            const p = frontEval.evalBase(fu, fv, false);
            const n = frontEval.evalFlushNormal(fu, fv);
            const lift = 0.0018 * (1.0 - 0.5 * vr * vr);
            return [p[0] + n.x * lift, p[1] + n.y * lift, p[2] + n.z * lift];
        }, { closedU: true, flipWinding: true });
        addMirroredMesh(group, coverGeo, mat.headlightLens, false, false);
    };
    buildConformalHeadlights();

    // E. Rejilla Hexagonal, Splitter, Canards, Extractor de Frenos y Emblema
    const frontGrilleGeo = buildParametricSurface(24, 8, (u, v) => {
        const s = (u - 0.5) * 2;
        const x = s * 0.80;
        const z = 2.24 - 0.30 * s * s;
        const y = lerp(0.118, 0.258 - 0.032 * s * s, v);
        return [x, y, z];
    }, { flipWinding: false });
    group.add(new THREE.Mesh(frontGrilleGeo, mat.hexMesh));

    const intakeBladeGeo = buildSculptedAirfoil(18, 10, u => ({
        x: lerp(0.18, 0.82, u),
        y: lerp(0.180, 0.215, u),
        z: lerp(2.26, 1.94, u * u),
        chord: lerp(0.095, 0.072, u),
        thickness: 0.13,
        camber: 0.03,
        pitch: 0.05,
        roll: -0.08
    }));
    addMirroredMesh(group, intakeBladeGeo, mat.carbon);

    const splitterGeo = buildParametricSurface(44, 16, (u, v) => {
        const s = (u - 0.5) * 2;
        const absS = Math.abs(s);
        const x = s * 0.995;

        const leadZ = 2.34 - 0.44 * Math.pow(absS, 1.85);
        const trailZ = Math.max(1.755, leadZ - lerp(0.24, 0.14, absS));

        const theta = v * Math.PI * 2;
        const xc = 0.5 * (1 + Math.cos(theta));
        const sign = Math.sin(theta) >= 0 ? 1 : -1;
        const halfThick = 0.012 * Math.sqrt(Math.max(0.04, Math.sin(xc * Math.PI)));
        const wingletLift = Math.pow(smoothstep(0.84, 1.0, absS), 1.85) * 0.115;

        const z = lerp(leadZ, trailZ, xc);
        const y = 0.112 + wingletLift + sign * halfThick + 0.008 * (1 - absS * absS) * (1 - xc);
        return [x, y, z];
    }, { closedV: true, worldUV: true, uvScaleU: 1.8, uvScaleV: 1.8 });
    const splitterMesh = new THREE.Mesh(splitterGeo, mat.carbon);
    splitterMesh.castShadow = true;
    splitterMesh.receiveShadow = true;
    group.add(splitterMesh);

    const canardGeo = buildSculptedAirfoil(20, 12, u => ({
        x: lerp(0.89, 1.015, u),
        y: lerp(0.215, 0.315, Math.pow(u, 1.3)),
        z: lerp(2.02, 1.78, u),
        chord: lerp(0.088, 0.048, u),
        thickness: 0.12,
        camber: -0.05,
        pitch: -0.18,
        roll: 0.36
    }));
    addMirroredMesh(group, canardGeo, mat.carbon);

    const brakeVentBackGeo = buildParametricSurface(14, 12, (u, v) => {
        const z = lerp(0.71, 0.98, u);
        const y = lerp(0.62, 0.17, v);
        const cove = Math.sin(v * Math.PI) * 0.045;
        const x = lerp(0.84, 0.89, u) - cove;
        return [x, y, z];
    }, { flipWinding: false });
    addMirroredMesh(group, brakeVentBackGeo, mat.voidBlack, false, true);

    for (let i = 0; i < 3; i++) {
        const y0 = 0.25 + i * 0.115;
        const louverGeo = buildSculptedAirfoil(14, 10, u => ({
            x: lerp(0.835, 0.945, u),
            y: y0 + u * 0.022,
            z: lerp(0.76, 0.93, u),
            chord: 0.055,
            thickness: 0.14,
            camber: 0.02,
            pitch: 0.16,
            roll: -0.24
        }));
        addMirroredMesh(group, louverGeo, mat.carbon);
    }

    const crestGeo = buildVariableTube([
        [0, frontEval.evalHoodCenterY(2.265) - 0.004, 2.265],
        [0, frontEval.evalHoodCenterY(2.235) + 0.002, 2.235],
        [0, frontEval.evalHoodCenterY(2.202) + 0.005, 2.202]
    ], t => [0.017 * (0.45 + 0.55 * Math.sin(t * Math.PI)), 0.0032], 12, 8);
    group.add(new THREE.Mesh(crestGeo, mat.machinedAlu));

    car.add(group);

    return {
        frunkPivot,
        frunkLight,
        frunkLedMat,
        updateStruts: (spaceParent) => {
            frunkStrutL.update(frunkChassisAnchorL, frunkLidAnchorL, spaceParent);
            frunkStrutR.update(frunkChassisAnchorR, frunkLidAnchorR, spaceParent);
        }
    };
}

/**
 * 4.3 Puertas Diédricas / Mariposa con Pistones Hidráulicos, Umbral de Carbono y Tomas "C"
 */
function buildDoorsAndSideIntakes(car, mat) {
    const group = new THREE.Group();

    const sillTubGeo = buildSplineLoft([
        [[0.66, 0.18, -0.76], [0.85, 0.17, -0.76], [0.86, 0.34, -0.76], [0.76, 0.42, -0.76], [0.66, 0.36, -0.76]],
        [[0.66, 0.18, -0.05], [0.85, 0.17, -0.05], [0.85, 0.34, -0.05], [0.75, 0.41, -0.05], [0.66, 0.35, -0.05]],
        [[0.66, 0.18, 0.67], [0.86, 0.17, 0.67], [0.86, 0.36, 0.67], [0.76, 0.44, 0.67], [0.66, 0.38, 0.67]]
    ], 22, 16, { closedV: true, worldUV: true });
    addMirroredMesh(group, sillTubGeo, mat.carbon, true, true);

    const jambSealGeo = buildVariableTube([
        [0.845, 0.19, 0.66],
        [0.845, 0.68, 0.64],
        [0.720, 0.72, 0.59],
        [0.515, 1.04, -0.04],
        [0.460, 1.02, -0.62],
        [0.860, 0.82, -0.74],
        [0.855, 0.20, -0.74]
    ], 0.0085, 36, 8);
    addMirroredMesh(group, jambSealGeo, mat.voidBlack, false, false);

    const evalDoorOuter = (u, v) => {
        const z = lerp(-0.78, 0.676, u);
        const yTop = lerp(0.840, 0.742, smootherstep(0, 1, u));
        const yBot = lerp(0.160, 0.155, u);
        const y = lerp(yTop, yBot, v);

        const shoulderX = lerp(0.965, 0.915, smootherstep(0, 1, u));
        const sillX = lerp(0.880, 0.895, u);
        const topTuck = -0.055 * Math.pow(smoothstep(0.18, 0.0, v), 1.8);
        const upperConvex = 0.044 * Math.sin(clamp(v / 0.65, 0, 1) * Math.PI);
        const rearPull = 1.0 - smootherstep(0.05, 0.88, u);
        const lowerBand = smoothstep(0.36, 0.72, v) * (1.0 - 0.55 * smoothstep(0.84, 1.0, v));
        const undercut = -0.105 * rearPull * lowerBand;

        const x = lerp(shoulderX, sillX, v) + topTuck + upperConvex + undercut;
        return [x, y, z];
    };

    const doorOuterGeo = buildParametricSurface(42, 26, evalDoorOuter, { worldUV: true, flipWinding: false });

    const doorInnerCardGeo = buildParametricSurface(24, 18, (u, v) => {
        const p = evalDoorOuter(u, v);
        const edge = smoothstep(0.0, 0.14, u) * smoothstep(1.0, 0.86, u) * smoothstep(0.0, 0.12, v) * smoothstep(1.0, 0.88, v);
        const thick = lerp(0.018, 0.058, edge);
        return [p[0] - thick, p[1], p[2]];
    }, { worldUV: true, flipWinding: true });

    const armrestGeo = buildVariableTube([
        [0.852, 0.565, 0.42],
        [0.842, 0.555, 0.02],
        [0.838, 0.580, -0.46]
    ], t => [0.026 * (0.7 + 0.35 * Math.sin(t * Math.PI)), 0.032], 18, 10);

    const pullStrapGeo = buildVariableTube([
        [0.822, 0.545, 0.18],
        [0.788, 0.515, 0.14],
        [0.785, 0.495, 0.07],
        [0.822, 0.535, 0.05]
    ], [0.008, 0.003], 14, 8);

    const ambientLedGeo = buildVariableTube([
        [0.842, 0.625, 0.46],
        [0.835, 0.620, 0.00],
        [0.845, 0.650, -0.52]
    ], [0.0032, 0.0032], 18, 8);

    const doorBladeGeo = buildVariableTube([
        [0.892, 0.420, 0.56],
        [0.858, 0.415, 0.08],
        [0.832, 0.430, -0.40],
        [0.885, 0.465, -0.74]
    ], t => [0.011, 0.022 * (0.65 + 0.35 * Math.sin(t * Math.PI))], 28, 10, { worldUV: true });

    const sideGlassGeo = buildParametricSurface(28, 16, (u, v) => {
        const zTop = lerp(-0.62, -0.02, u);
        const zBot = lerp(-0.58, 0.60, u);
        const z = lerp(zTop, zBot, v);
        const yTop = lerp(1.025, 1.058, Math.sin(u * Math.PI * 0.65 + 0.35));
        const yBot = lerp(0.835, 0.742, u);
        const y = lerp(yTop, yBot, v);
        const xTop = lerp(0.460, 0.522, u);
        const xBot = lerp(0.895, 0.855, u) - 0.010 * Math.sin(u * Math.PI);
        const bulge = Math.sin(v * Math.PI) * 0.048;
        const x = lerp(xTop, xBot, Math.pow(v, 1.08)) + bulge;
        return [x, y, z];
    }, { flipWinding: false });

    const bPillarGeo = buildVariableTube([
        [0.862, 0.806, -0.26],
        [0.725, 0.935, -0.30],
        [0.486, 1.046, -0.34]
    ], [0.009, 0.015], 14, 8);

    const stalkGeo = buildSculptedAirfoil(18, 12, u => ({
        x: lerp(0.870, 1.035, u),
        y: lerp(0.755, 0.818, smoothstep(0, 1, u)),
        z: lerp(0.46, 0.40, u),
        chord: lerp(0.082, 0.052, u),
        thickness: 0.22,
        camber: 0.04,
        pitch: 0.08,
        roll: 0.28
    }));

    const mirrorCapGeo = buildParametricSurface(18, 14, (u, v) => {
        const theta = lerp(-0.10, Math.PI + 0.10, v);
        const prof = Math.sin(Math.pow(u, 0.74) * Math.PI);
        return [
            lerp(0.985, 1.140, u),
            0.828 + Math.sin(theta) * 0.036 * prof,
            0.398 + Math.cos(theta) * 0.064 * prof - u * 0.025
        ];
    }, { worldUV: true, flipWinding: false });

    const mirrorBaseGeo = buildParametricSurface(18, 12, (u, v) => {
        const theta = lerp(Math.PI, Math.PI * 2, v);
        const prof = Math.sin(Math.pow(u, 0.74) * Math.PI);
        return [
            lerp(0.985, 1.140, u),
            0.828 + Math.sin(theta) * 0.024 * prof,
            0.398 + Math.cos(theta) * 0.060 * prof - u * 0.025
        ];
    }, { worldUV: true, flipWinding: false });

    const mirrorLedGeo = buildVariableTube([
        [1.045, 0.826, 0.448],
        [1.105, 0.828, 0.422]
    ], [0.0022, 0.0022], 8, 8);

    const mirrorFaceGeo = buildParametricSurface(12, 8, (u, v) => {
        const a = u * Math.PI * 2;
        return [
            1.062 + Math.cos(a) * 0.052 * v,
            0.828 + Math.sin(a) * 0.024 * v,
            0.342 - 0.006 * Math.cos(a) * v
        ];
    }, { flipWinding: true });

    const doorAmbientMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color('#ff182a'),
        emissive: new THREE.Color('#ff1426'),
        emissiveIntensity: 1.65,
        roughness: 0.2,
        toneMapped: false
    });

    const assembleButterflyDoor = (side, partName) => {
        const pivotPos = new THREE.Vector3(side * 0.82, 0.73, 0.68);
        const pivot = new THREE.Group();
        pivot.position.copy(pivotPos);
        group.add(pivot);

        const content = new THREE.Group();
        content.position.set(-pivotPos.x, -pivotPos.y, -pivotPos.z);
        pivot.add(content);

        const addPart = (geo, material, cast = true, recv = true, order = 0) => {
            const g = side > 0 ? geo : mirrorGeometryX(geo);
            const m = new THREE.Mesh(g, material);
            m.castShadow = cast;
            m.receiveShadow = recv;
            if (order) m.renderOrder = order;
            content.add(m);
            return m;
        };

        addPart(doorOuterGeo, mat.paint, true, true);
        addPart(doorInnerCardGeo, mat.carbon, false, true);
        addPart(armrestGeo, mat.alcantara, false, true);
        addPart(pullStrapGeo, mat.seatTrimRed, false, false);
        addPart(ambientLedGeo, doorAmbientMat, false, false);
        addPart(doorBladeGeo, mat.carbon, true, true);
        addPart(sideGlassGeo, mat.glass, false, false, 4);
        addPart(bPillarGeo, mat.voidBlack, false, false);
        addPart(stalkGeo, mat.carbon, true, true);
        addPart(mirrorCapGeo, mat.paint, true, true);
        addPart(mirrorBaseGeo, mat.carbon, true, true);
        addPart(mirrorLedGeo, mat.ledWhite, false, false);
        addPart(mirrorFaceGeo, mat.mirrorChrome, false, false);

        const doorStrutAnchor = new THREE.Object3D();
        doorStrutAnchor.position.set(side * 0.84, 0.44, 0.34);
        content.add(doorStrutAnchor);

        const chassisStrutAnchor = new THREE.Object3D();
        chassisStrutAnchor.position.set(side * 0.74, 0.50, 0.62);
        group.add(chassisStrutAnchor);

        const strut = createHydraulicStrut(group, mat, 0.255, 0.275, 0.0095, 0.0046);
        const dihedralAxis = new THREE.Vector3(0.62, -0.70 * side, 0.28 * side).normalize();

        tagInteractive(pivot, partName);

        return {
            pivot,
            dihedralAxis,
            maxAngle: 1.06,
            updateStrut: (spaceParent) => strut.update(chassisStrutAnchor, doorStrutAnchor, spaceParent)
        };
    };

    const doorL = assembleButterflyDoor(1, 'doorL');
    const doorR = assembleButterflyDoor(-1, 'doorR');

    const cabinWelcomeLight = new THREE.PointLight(0xffcf96, 0.0, 1.9, 2.0);
    cabinWelcomeLight.position.set(0, 0.94, -0.06);
    group.add(cabinWelcomeLight);

    // Taloneras de carbono y tomas laterales en "C"
    const skirtGeo = buildParametricSurface(38, 14, (u, v) => {
        const z = lerp(-0.92, 0.96, u);
        const theta = v * Math.PI * 2;
        const xc = 0.5 * (1 + Math.cos(theta));
        const sign = Math.sin(theta) >= 0 ? 1 : -1;

        const outerX = lerp(0.995, 0.945, u) + 0.024 * Math.pow(1 - u, 3);
        const innerX = outerX - 0.14;
        const x = lerp(outerX, innerX, xc);

        const wingletLift = Math.pow(smoothstep(0.16, 0.0, u), 1.85) * 0.155 * (1 - xc);
        const yBase = 0.116 + 0.018 * xc + wingletLift;
        const halfThick = 0.012 * Math.sqrt(Math.max(0.05, Math.sin(xc * Math.PI)));
        return [x, yBase + sign * halfThick, z];
    }, { closedV: true, worldUV: true, uvScaleU: 1.8, uvScaleV: 1.5 });
    addMirroredMesh(group, skirtGeo, mat.carbon);

    const cFrameGeo = buildVariableTube([
        [0.885, 0.852, -0.52],
        [0.955, 0.818, -0.66],
        [1.002, 0.675, -0.78],
        [0.998, 0.460, -0.80],
        [0.972, 0.275, -0.74],
        [0.935, 0.175, -0.58]
    ], t => {
        const w = 0.024 + 0.018 * Math.sin(t * Math.PI);
        return [w * 0.68, w * 1.40];
    }, 36, 12, { worldUV: true });
    addMirroredMesh(group, cFrameGeo, mat.carbon);

    const radGrilleGeo = buildParametricSurface(12, 12, (u, v) => {
        const z = lerp(-0.88, -0.72, u);
        const y = lerp(0.78, 0.22, v);
        const arc = Math.sin(v * Math.PI);
        const x = lerp(0.72, 0.86, u) + 0.042 * arc;
        return [x, y, z];
    }, { flipWinding: false });
    addMirroredMesh(group, radGrilleGeo, mat.hexMesh, false, true);

    const sideVaneGeo = buildSculptedAirfoil(14, 10, u => ({
        x: lerp(0.74, 0.965, u),
        y: 0.495,
        z: lerp(-0.84, -0.71, u),
        chord: 0.12,
        thickness: 0.12,
        camber: 0,
        pitch: 0,
        roll: 0
    }));
    addMirroredMesh(group, sideVaneGeo, mat.carbon);

    car.add(group);
    return { doorL, doorR, cabinWelcomeLight };
}

/**
 * 4.4 Caderas Traseras Musculosas, Arbotantes Voladores y Puente Kamm-Tail
 */
function buildRearHaunches(car, mat) {
    const group = new THREE.Group();

    const TH_REAR = Math.PI + 0.3928;
    const TH_FRONT = -0.5310;
    const U_ARCH_0 = 0.22;
    const U_ARCH_1 = 0.80;

    const evalRear = (u, v) => {
        const zInner = lerp(-2.26, -0.68, u);
        const xInner = lerp(0.54, 0.52, u) + 0.04 * Math.sin(u * Math.PI);
        const yInner = lerp(0.835, 0.975, smootherstep(0, 1, u));

        let zLip, yLip, xLip;
        if (u < U_ARCH_0) {
            const k = u / U_ARCH_0;
            const zRearBot = SPEC.rZ + Math.cos(TH_REAR) * SPEC.rArchR;
            zLip = lerp(-2.24, zRearBot, k);
            yLip = lerp(0.365, 0.210, smootherstep(0, 1, k));
            xLip = lerp(0.915, 1.008, smoothstep(0, 1, k));
        } else if (u <= U_ARCH_1) {
            const k = (u - U_ARCH_0) / (U_ARCH_1 - U_ARCH_0);
            const th = lerp(TH_REAR, TH_FRONT, k);
            const cosT = Math.cos(th);
            const sinT = Math.sin(th);
            zLip = SPEC.rZ + cosT * SPEC.rArchR;
            yLip = SPEC.rR + sinT * SPEC.rArchR;
            xLip = 1.028 - 0.028 * Math.pow(Math.abs(cosT), 1.65) - 0.015 * Math.max(0, -sinT);
        } else {
            const k = (u - U_ARCH_1) / (1.0 - U_ARCH_1);
            const zFrontBot = SPEC.rZ + Math.cos(TH_FRONT) * SPEC.rArchR;
            zLip = lerp(zFrontBot, -0.70, k);
            yLip = lerp(0.160, 0.165, k);
            xLip = lerp(1.005, 0.960, smoothstep(0, 1, k));
        }

        const vNorm = Math.min(v / 0.90, 1.0);
        const z = lerp(zInner, zLip, smootherstep(0.28, 0.90, vNorm));

        if (v <= 0.68) {
            const s = v / 0.68;
            const haunchWave = gauss(z, SPEC.rZ + 0.04, 0.50);
            const xShoulder = Math.max(xLip, 0.955 + 0.078 * haunchWave);
            const yShoulder = Math.max(yLip + 0.055, lerp(0.825, 0.875, u)) + 0.052 * haunchWave;

            const x = lerp(xInner, xShoulder, Math.pow(s, 0.90));
            const crown = 0.042 * Math.sin(s * Math.PI) * (0.45 + 0.55 * haunchWave);
            const y = lerp(yInner, yShoulder, smootherstep(0, 1, s)) + crown;
            return [x, y, z];
        } else if (v <= 0.90) {
            const st = (v - 0.68) / 0.22;
            const topP = evalRear(u, 0.68);
            const bulge = Math.sin(st * Math.PI) * 0.028;
            const x = lerp(topP[0], xLip, smootherstep(0, 1, st)) + bulge;
            const y = lerp(topP[1], yLip, Math.pow(st, 1.06));
            return [x, y, z];
        } else {
            const lt = (v - 0.90) / 0.10;
            const lipP = evalRear(u, 0.90);
            const rollIn = 0.036 * smootherstep(0, 1, lt);
            let dzRoll = 0, dyRoll = -0.005 * lt;
            if (u >= U_ARCH_0 && u <= U_ARCH_1) {
                const k = (u - U_ARCH_0) / (U_ARCH_1 - U_ARCH_0);
                const th = lerp(TH_REAR, TH_FRONT, k);
                dzRoll = -Math.cos(th) * 0.005 * lt;
                dyRoll = -Math.sin(th) * 0.005 * lt;
            }
            return [lipP[0] - rollIn, lipP[1] + dyRoll, lipP[2] + dzRoll];
        }
    };

    const rearHaunchGeo = buildParametricSurface(56, 36, (u, v) => evalRear(u, v), {
        worldUV: true,
        flipWinding: false
    });
    addMirroredMesh(group, rearHaunchGeo, mat.paint, true, true);

    const buttressGeo = buildSplineLoft([
        [[0.44, 1.052, -0.60], [0.51, 1.015, -0.60], [0.55, 0.960, -0.60], [0.48, 0.968, -0.60]],
        [[0.52, 0.992, -1.08], [0.61, 0.945, -1.08], [0.65, 0.895, -1.08], [0.56, 0.905, -1.08]],
        [[0.62, 0.915, -1.62], [0.73, 0.878, -1.62], [0.77, 0.838, -1.62], [0.66, 0.848, -1.62]],
        [[0.68, 0.848, -2.14], [0.82, 0.828, -2.14], [0.84, 0.805, -2.14], [0.72, 0.808, -2.14]]
    ], 28, 14, { closedV: true, worldUV: true });
    addMirroredMesh(group, buttressGeo, mat.paint);

    const tailBridgeGeo = buildParametricSurface(14, 32, (u, v) => {
        const s = (v - 0.5) * 2;
        const x = s * 0.94;
        const sweep = 0.068 * s * s;
        const z = lerp(-2.28, -2.08, u) + sweep;
        const lipDrop = -0.042 * Math.pow(smoothstep(0.32, 0.0, u), 1.75);
        const y = 0.846 - 0.022 * s * s + lipDrop + 0.012 * Math.sin(u * Math.PI);
        return [x, y, z];
    }, { worldUV: true, flipWinding: false });
    const tailBridge = new THREE.Mesh(tailBridgeGeo, mat.paint);
    tailBridge.castShadow = true;
    tailBridge.receiveShadow = true;
    group.add(tailBridge);

    car.add(group);
}

/**
 * 4.5 Cabina en Gota, Parabrisas con Frit Cerámico y Techo Doble Burbuja
 */
function buildCanopyAndRoof(car, mat) {
    const group = new THREE.Group();

    const windshieldGeo = buildParametricSurface(32, 28, (u, v) => {
        const s = (v - 0.5) * 2;
        const absS = Math.abs(s);

        const halfW = lerp(0.515, 0.725, smoothstep(0, 1, u));
        const x = s * halfW;

        const wrapBack = lerp(0.11, 0.18, u) * Math.pow(absS, 1.85);
        const z = lerp(0.02, 0.78, u) - wrapBack;

        const dome = (1 - absS * absS) * lerp(0.042, 0.028, u);
        const y = lerp(1.088, 0.724, Math.pow(u, 1.08)) + dome;
        return [x, y, z];
    }, { flipWinding: false });
    const wsMesh = new THREE.Mesh(windshieldGeo, mat.glass);
    wsMesh.renderOrder = 4;
    group.add(wsMesh);

    const wsFritBotGeo = buildParametricSurface(6, 24, (u, v) => {
        const s = (v - 0.5) * 2;
        const absS = Math.abs(s);
        const uu = lerp(0.92, 1.0, u);
        const x = s * lerp(0.515, 0.725, smoothstep(0, 1, uu));
        const z = lerp(0.02, 0.78, uu) - lerp(0.11, 0.18, uu) * Math.pow(absS, 1.85);
        const y = lerp(1.088, 0.724, Math.pow(uu, 1.08)) + (1 - absS * absS) * lerp(0.042, 0.028, uu) - 0.002;
        return [x, y, z];
    }, { flipWinding: false });
    group.add(new THREE.Mesh(wsFritBotGeo, mat.voidBlack));

    const roofGeo = buildParametricSurface(32, 32, (u, v) => {
        const s = (v - 0.5) * 2;
        const absS = Math.abs(s);

        const halfW = lerp(0.455, 0.515, smoothstep(0, 1, u));
        const x = s * halfW;

        const wrap = 0.105 * Math.pow(absS, 1.8) * (0.45 + 0.55 * u);
        const z = lerp(-0.66, 0.02, u) - wrap;

        const longArc = Math.sin(lerp(0.14, 0.86, u) * Math.PI);
        const baseArch = lerp(1.036, 1.088, u) + 0.030 * longArc;
        const latDrop = -0.046 * Math.pow(absS, 2.0);
        const bubble = 0.018 * gauss(absS, 0.48, 0.20) * Math.sin(u * Math.PI);

        return [x, baseArch + latDrop + bubble, z];
    }, { worldUV: true, uvScaleU: 1.0, uvScaleV: 1.0, flipWinding: false });
    const roofMesh = new THREE.Mesh(roofGeo, mat.carbon);
    roofMesh.castShadow = true;
    roofMesh.receiveShadow = true;
    group.add(roofMesh);

    const scoopGeo = buildSplineLoft([
        [[0, 1.106, -0.10], [0.085, 1.108, -0.10], [0.072, 1.136, -0.12], [0, 1.145, -0.13], [-0.072, 1.136, -0.12], [-0.085, 1.108, -0.10]],
        [[0, 1.092, -0.38], [0.095, 1.094, -0.38], [0.068, 1.136, -0.38], [0, 1.144, -0.38], [-0.068, 1.136, -0.38], [-0.095, 1.094, -0.38]],
        [[0, 1.044, -0.70], [0.078, 1.046, -0.70], [0.044, 1.088, -0.70], [0, 1.096, -0.70], [-0.044, 1.088, -0.70], [-0.078, 1.046, -0.70]],
        [[0, 0.996, -0.96], [0.052, 0.998, -0.96], [0.026, 1.024, -0.96], [0, 1.030, -0.96], [-0.026, 1.024, -0.96], [-0.052, 0.998, -0.96]]
    ], 24, 18, { closedV: true, worldUV: true });
    const scoopMesh = new THREE.Mesh(scoopGeo, mat.carbon);
    scoopMesh.castShadow = true;
    group.add(scoopMesh);

    const scoopMouthGeo = buildParametricSurface(8, 10, (u, v) => {
        const s = (v - 0.5) * 2;
        return [s * 0.068, lerp(1.110, 1.138 - 0.010 * s * s, u), -0.125 - 0.010 * Math.abs(s)];
    }, { flipWinding: true });
    group.add(new THREE.Mesh(scoopMouthGeo, mat.hexMesh));

    const pillarGeo = buildVariableTube([
        [0.728, 0.725, 0.60],
        [0.642, 0.900, 0.34],
        [0.520, 1.052, -0.04],
        [0.486, 1.064, -0.32],
        [0.456, 1.026, -0.64]
    ], t => [0.020, 0.030 * (1 - 0.22 * t)], 36, 12, { worldUV: true });
    addMirroredMesh(group, pillarGeo, mat.carbon);

    car.add(group);
}

        new THREE.Vector2(0.040, 0.008),
        new THREE.Vector2(0.032, 0.018),
        new THREE.Vector2(0.0, 0.020)
    ], 18), mat.machinedAlu);
    xHub.position.set(0, 0.900, -1.28);
    group.add(xHub);

    const bayLight = new THREE.PointLight(0xffdca8, 0.95, 1.45, 2.0);
    bayLight.position.set(0, 0.92, -1.28);
    group.add(bayLight);

    const engGlassGeo = buildParametricSurface(22, 18, (u, v) => {
        const s = (v - 0.5) * 2;
        const z = lerp(-2.10, -0.70, u);
        const halfW = lerp(0.53, 0.46, u);
        const y = lerp(0.842, 1.028, smoothstep(0, 1, u)) - 0.022 * s * s;
        return [s * halfW, y, z];
    }, { flipWinding: false });
    const engGlassMesh = new THREE.Mesh(engGlassGeo, mat.engineGlass);
    engGlassMesh.renderOrder = 3;
    group.add(engGlassMesh);

    for (let i = 0; i < 6; i++) {
        const t = i / 5;
        const z = lerp(-1.00, -1.90, t);
        const y = lerp(0.988, 0.870, t);
        const wSpan = lerp(0.42, 0.48, t);
        const slatGeo = buildSculptedAirfoil(12, 10, u => ({
            x: lerp(0.24, wSpan, u),
            y: y - 0.016 * u * u + 0.008,
            z: z - 0.028 * u,
            chord: 0.056,
            thickness: 0.13,
            camber: 0.02,
            pitch: 0.24,
            roll: -0.05
        }));
        addMirroredMesh(group, slatGeo, mat.carbon);
    }

    group.add(new THREE.Mesh(buildVariableTube([
        [0, 1.024, -0.82],
        [0, 0.960, -1.36],
        [0, 0.886, -1.90],
        [0, 0.850, -2.12]
    ], t => [0.024 * (1 - 0.30 * t), 0.016], 20, 10, { worldUV: true }), mat.carbon));

    group.add(new THREE.Mesh(buildVariableTube([
        [0, 1.036, -0.86],
        [0, 1.002, -1.10]
    ], [0.0055, 0.004], 10, 8), mat.ledRed));

    car.add(group);
}

/**
 * 4.7 Zaga Kamm-Tail, Pilotos OLED 3D Rubí, Cuádruple Escape, Difusor y Alerón Swan-Neck

function buildRearFasciaAndAero(car, mat) {

    group.add(new THREE.Mesh(rearGrilleGeo, mat.hexMesh));

    const rearBezelGeo = buildVariableTube([

    addMirroredMesh(group, rearBezelGeo, mat.carbon);

    const tlUpperPts = [

    group.add(new THREE.Mesh(buildVariableTube(tlUpperPts, [0.0058, 0.0085], 56, 10), mat.ledRed));

    const tipProfile = [

        new THREE.Vector2(0.050, 0.215),
        new THREE.Vector2(0.047, 0.224),

    const exhaustTipGeo = new THREE.LatheGeometry(tipProfile, 32);

    const bezelPts = [];
    for (let i = 0; i < 20; i++) {

    group.add(new THREE.Mesh(buildVariableTube(bezelPts, [0.014, 0.018], 32, 10, { closed: true, worldUV: true }), mat.carbon));

    [
        [-0.172, 0.531, -2.085],
        [-0.058, 0.537, -2.095],
        [0.058, 0.537, -2.095],
        [0.172, 0.531, -2.085]
    ].forEach(([ex, ey, ez]) => {
        const tip = new THREE.Mesh(exhaustTipGeo, mat.titanium);
        tip.position.set(ex, ey, ez);
        tip.rotation.x = 0.045;
        tip.castShadow = true;
        group.add(tip);
    });

    const diffuserDeckGeo = buildParametricSurface(18, 30, (u, v) => {
        const s = (v - 0.5) * 2;
        const x = s * 0.68;
        const z = lerp(-2.31, -1.56, u) + 0.05 * s * s * (1 - u);
        const ramp = Math.pow(1 - u, 1.55);
        const venturiArch = 0.044 * Math.sin(Math.abs(s) * Math.PI) * (1 - u);
        const y = 0.120 + ramp * 0.248 + venturiArch;
        return [x, y, z];
    }, { worldUV: true, uvScaleU: 1.8, uvScaleV: 1.8, flipWinding: false });
    const diffMesh = new THREE.Mesh(diffuserDeckGeo, mat.carbon);
    diffMesh.castShadow = true;
    diffMesh.receiveShadow = true;
    group.add(diffMesh);

    group.add(new THREE.Mesh(buildVariableTube([
        [-0.67, 0.360, -2.26],
        [-0.34, 0.378, -2.31],
        [0.00, 0.370, -2.32],
        [0.34, 0.378, -2.31],
        [0.67, 0.360, -2.26]
    ], [0.013, 0.015], 28, 10, { worldUV: true }), mat.carbon));

    [0.145, 0.375, 0.605].forEach((sx, idx) => {
        const strakeH = lerp(0.235, 0.185, idx / 2);
        const strakeGeo = buildSculptedAirfoil(16, 12, u => ({
            x: sx + idx * 0.014 * (1 - u),
            y: lerp(0.124 + idx * 0.008, 0.124 + strakeH + idx * 0.010, u),
            z: lerp(-1.95, -2.06, u) + idx * 0.022,
            chord: lerp(0.64 - idx * 0.06, 0.42, u),

            camber: 0.02,
            pitch: 0,
            roll: Math.PI * 0.5
        }));
        addMirroredMesh(group, strakeGeo, mat.carbon);
    });

    group.add(new THREE.Mesh(buildVariableTube([
        [0, 0.195, -2.275],
        [0, 0.312, -2.305]
    ], [0.006, 0.0048], 8, 8), mat.ledRed));

    const wingGeo = buildSculptedAirfoil(48, 22, u => {
        const s = (u - 0.5) * 2;
        const absS = Math.abs(s);
        return {
            x: s * 0.92,
            y: 1.062 + 0.032 * Math.pow(absS, 1.7),
            z: -2.15 - 0.105 * Math.pow(absS, 1.8),
            chord: lerp(0.30, 0.24, absS * absS),
            thickness: 0.135,
            camber: -0.075,
            pitch: 0.13 + 0.025 * absS,
            roll: -s * 0.035

    const wingMesh = new THREE.Mesh(wingGeo, mat.carbon);

    const epShape = new THREE.Shape();
