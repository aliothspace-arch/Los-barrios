    epShape.bezierCurveTo(0.175, 0.018, 0.175, -0.068, 0.088, -0.100);
    epShape.bezierCurveTo(-0.04, -0.120, -0.165, -0.075, -0.180, 0.012);
    epShape.bezierCurveTo(-0.180, 0.078, -0.075, 0.112, 0.042, 0.102);
    epShape.bezierCurveTo(0.10, 0.092, 0.128, 0.068, 0.14, 0.048);

    const epGeo = new THREE.ExtrudeGeometry(epShape, {
        depth: 0.011,
        bevelEnabled: true,
        bevelThickness: 0.0045,
        bevelSize: 0.004,
        bevelSegments: 4,
        curveSegments: 20
    });
    epGeo.rotateY(Math.PI * 0.5);
    epGeo.translate(0.916, 1.094, -2.26);
    addMirroredMesh(group, epGeo, mat.carbon);

    addMirroredMesh(group, buildVariableTube([
        [0.930, 1.028, -2.14],
        [0.930, 0.996, -2.26],
        [0.930, 1.018, -2.38]
    ], [0.003, 0.0038], 14, 8), mat.anodizedRed, false, false);

    const swanNeckGeo = buildVariableTube([
        [0.24, 0.842, -1.98],
        [0.25, 0.946, -2.03],
        [0.255, 1.076, -2.01],
        [0.26, 1.122, -2.09],
        [0.26, 1.084, -2.16]
    ], t => [0.011, 0.034 * (1.15 - 0.35 * t)], 30, 12);
    addMirroredMesh(group, swanNeckGeo, mat.machinedAlu);

    addMirroredMesh(group, buildVariableTube([
        [0.26, 1.082, -2.13],
        [0.26, 1.068, -2.23]
    ], [0.014, 0.007], 8, 8), mat.carbon);

    car.add(group);
}

/**
 * 4.8 Ruedas Forjadas Cóncavas 20"/21", Dirección Ackermann y Frenos Carbono-Cerámicos
 */
function buildWheelsAndBrakes(wheelsParent, mat) {
    const wheelRig = {
        frontLeft: null,
        frontRight: null,
        rearLeft: null,
        rearRight: null
    };

    const createWheelCorner = (radius, width, isFront, isLeft) => {
        const cornerRoot = new THREE.Group();
        const knuckleGroup = new THREE.Group();
        const spinHub = new THREE.Group();
        cornerRoot.add(knuckleGroup);
        knuckleGroup.add(spinHub);

        const sideSign = isLeft ? 1 : -1;
        const rimR = radius * 0.768;
        const halfW = width * 0.5;

        const tireSpline = new THREE.SplineCurve([
            new THREE.Vector2(rimR - 0.005, -halfW * 0.88),
            new THREE.Vector2(rimR + 0.012, -halfW * 0.94),
            new THREE.Vector2(rimR + 0.038, -halfW * 1.01),
            new THREE.Vector2(radius - 0.020, -halfW * 0.99),
            new THREE.Vector2(radius - 0.007, -halfW * 0.90),
            new THREE.Vector2(radius - 0.002, -halfW * 0.75),
            new THREE.Vector2(radius, -halfW * 0.42),
            new THREE.Vector2(radius + 0.002, 0),
            new THREE.Vector2(radius, halfW * 0.42),
            new THREE.Vector2(radius - 0.002, halfW * 0.75),
            new THREE.Vector2(radius - 0.007, halfW * 0.90),
            new THREE.Vector2(radius - 0.020, halfW * 0.99),
            new THREE.Vector2(rimR + 0.038, halfW * 1.01),
            new THREE.Vector2(rimR + 0.012, halfW * 0.95),
            new THREE.Vector2(rimR - 0.005, halfW * 0.88)
        ]);
        const tireGeo = new THREE.LatheGeometry(tireSpline.getPoints(30), 48);
        tireGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        const tireMesh = new THREE.Mesh(tireGeo, mat.tire);
        tireMesh.castShadow = true;
        tireMesh.receiveShadow = true;
        spinHub.add(tireMesh);

        const barrelGeo = new THREE.LatheGeometry([
            new THREE.Vector2(rimR - 0.004, -halfW * 0.88),
            new THREE.Vector2(rimR - 0.018, -halfW * 0.80),
            new THREE.Vector2(rimR - 0.024, -halfW * 0.22),
            new THREE.Vector2(rimR - 0.020, halfW * 0.54),
            new THREE.Vector2(rimR - 0.006, halfW * 0.84),
            new THREE.Vector2(rimR + 0.004, halfW * 0.89),
            new THREE.Vector2(rimR - 0.004, halfW * 0.91),
            new THREE.Vector2(rimR - 0.016, halfW * 0.86),
            new THREE.Vector2(rimR - 0.032, halfW * 0.58),
            new THREE.Vector2(rimR - 0.032, -halfW * 0.80)
        ], 44);
        barrelGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        const barrelMesh = new THREE.Mesh(barrelGeo, mat.wheelAlloy);
        barrelMesh.castShadow = true;
        spinHub.add(barrelMesh);

        const hubOutX = sideSign * (isFront ? halfW * 0.22 : halfW * 0.10);
        const rimOutX = sideSign * (halfW * 0.78);
        const midDishX = sideSign * (isFront ? halfW * 0.44 : halfW * 0.28);

        // 10 radios en Y forjados cóncavos
        for (let i = 0; i < 5; i++) {
            const baseA = (i / 5) * Math.PI * 2;
            const split = 0.285;

            [-1, 1].forEach(fork => {
                const a0 = baseA + fork * 0.070;
                const a1 = baseA + fork * 0.138;
                const a2 = baseA + fork * split;
                const r0 = 0.056;
                const r1 = rimR * 0.46;
                const r2 = rimR * 0.955;

                const spokeGeo = buildVariableTube([
                    [hubOutX, Math.sin(a0) * r0, Math.cos(a0) * r0],
                    [midDishX, Math.sin(a1) * r1, Math.cos(a1) * r1],
                    [lerp(midDishX, rimOutX, 0.65), Math.sin(lerp(a1, a2, 0.62)) * (rimR * 0.74), Math.cos(lerp(a1, a2, 0.62)) * (rimR * 0.74)],
                    [rimOutX, Math.sin(a2) * r2, Math.cos(a2) * r2]
                ], t => {
                    const th = lerp(0.0135, 0.0082, t);
                    return [th * 1.42, th * 0.76];
                }, 14, 8);
                const sMesh = new THREE.Mesh(spokeGeo, mat.wheelAlloy);
                sMesh.castShadow = true;
                spinHub.add(sMesh);

                spinHub.add(new THREE.Mesh(buildVariableTube([
                    [hubOutX + sideSign * 0.009, Math.sin(a0) * (r0 + 0.01), Math.cos(a0) * (r0 + 0.01)],
                    [midDishX + sideSign * 0.008, Math.sin(a1) * r1, Math.cos(a1) * r1],
                    [rimOutX + sideSign * 0.005, Math.sin(a2) * (r2 - 0.008), Math.cos(a2) * (r2 - 0.008)]
                ], [0.0036, 0.0024], 12, 6), mat.machinedAlu));
            });
        }

        // Válvula de aire metálica
        spinHub.add(new THREE.Mesh(buildVariableTube([
            [sideSign * (halfW * 0.72), rimR - 0.020, 0],
            [sideSign * (halfW * 0.74), rimR - 0.042, 0]
        ], 0.003, 6, 6), mat.machinedAlu));

        // Campana central y monotuerca anodizada roja
        const hubBellGeo = new THREE.LatheGeometry([
            new THREE.Vector2(0.0, halfW * 0.02),
            new THREE.Vector2(0.068, halfW * 0.06),
            new THREE.Vector2(0.064, halfW * 0.25),
            new THREE.Vector2(0.048, halfW * 0.30),
            new THREE.Vector2(0.0, halfW * 0.30)
        ], 24);
        hubBellGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        spinHub.add(new THREE.Mesh(hubBellGeo, mat.wheelAlloy));

        const nutShape = new THREE.Shape();
        for (let i = 0; i <= 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            const r = i % 2 === 0 ? 0.042 : 0.034;
            if (i === 0) nutShape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else nutShape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        const nutGeo = new THREE.ExtrudeGeometry(nutShape, {
            depth: 0.019,
            bevelEnabled: true,
            bevelThickness: 0.0045,
            bevelSize: 0.0038,
            bevelSegments: 3
        });
        nutGeo.rotateY(isLeft ? Math.PI * 0.5 : -Math.PI * 0.5);
        nutGeo.translate(sideSign * (halfW * 0.26), 0, 0);
        spinHub.add(new THREE.Mesh(nutGeo, mat.anodizedRed));

        const pinGeo = new THREE.LatheGeometry([
            new THREE.Vector2(0, 0),
            new THREE.Vector2(0.018, 0),
            new THREE.Vector2(0.016, 0.011),
            new THREE.Vector2(0.009, 0.016),
            new THREE.Vector2(0, 0.017)
        ], 16);
        pinGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        pinGeo.translate(sideSign * (halfW * 0.33), 0, 0);
        spinHub.add(new THREE.Mesh(pinGeo, mat.machinedAlu));

        // Disco carbono-cerámico perforado (gira con spinHub)
        const rotorR = isFront ? 0.204 : 0.194;
        const rotorX = 0.0;

        const makeRotorFace = (offsetX, flip) => {
            const g = buildParametricSurface(36, 4, (u, v) => {
                const a = u * Math.PI * 2;
                const r = lerp(rotorR * 0.50, rotorR, v);
                return [rotorX + offsetX, Math.sin(a) * r, Math.cos(a) * r];
            }, { flipWinding: flip });
            const pos = g.attributes.position;
            const uv = g.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                uv.setXY(i, 0.5 + pos.getZ(i) / (rotorR * 2), 0.5 + pos.getY(i) / (rotorR * 2));
            }
            uv.needsUpdate = true;
            return g;
        };
        spinHub.add(new THREE.Mesh(makeRotorFace(sideSign * 0.015, !isLeft), mat.ceramicRotor));
        spinHub.add(new THREE.Mesh(makeRotorFace(-sideSign * 0.015, isLeft), mat.ceramicRotor));

        spinHub.add(new THREE.Mesh(buildParametricSurface(36, 4, (u, v) => {
            const a = u * Math.PI * 2;
            const r = rotorR - 0.002 * Math.sin(v * Math.PI);
            return [rotorX + lerp(-0.015, 0.015, v), Math.sin(a) * r, Math.cos(a) * r];
        }, { closedU: true }), mat.matteCarbon));

        const hatGeo = new THREE.LatheGeometry([
            new THREE.Vector2(0.055, -0.020),
            new THREE.Vector2(rotorR * 0.52, -0.016),
            new THREE.Vector2(rotorR * 0.52, 0.016),
            new THREE.Vector2(rotorR * 0.45, 0.025),
            new THREE.Vector2(0.055, 0.025)
        ], 24);
        hatGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        hatGeo.translate(rotorX, 0, 0);
        spinHub.add(new THREE.Mesh(hatGeo, mat.matteCarbon));

        for (let b = 0; b < 10; b++) {
            const ba = (b / 10) * Math.PI * 2;
            const br = rotorR * 0.51;
            spinHub.add(new THREE.Mesh(buildVariableTube([
                [rotorX + sideSign * 0.009, Math.sin(ba) * br, Math.cos(ba) * br],
                [rotorX + sideSign * 0.022, Math.sin(ba) * br, Math.cos(ba) * br]
            ], 0.0065, 5, 6), mat.machinedAlu));
        }

        // Mangueta y pinza Giallo Modena de 6 pistones (estacionaria al rodar, gira con dirección)
        const uprightGeo = new THREE.LatheGeometry([
            new THREE.Vector2(0.032, -halfW * 0.65),
            new THREE.Vector2(0.060, -halfW * 0.35),
            new THREE.Vector2(0.055, -halfW * 0.12),
            new THREE.Vector2(0.030, -halfW * 0.10)
        ], 16);
        uprightGeo.rotateZ(isLeft ? -Math.PI * 0.5 : Math.PI * 0.5);
        knuckleGroup.add(new THREE.Mesh(uprightGeo, mat.matteCarbon));

        const calCenterA = isFront ? Math.PI : 0;
        const calSpan = isFront ? 1.08 : 0.90;
        const calInR = rotorR * 0.63;
        const calOutR = rotorR + 0.035;

        const calShape = new THREE.Shape();
        const segs = 16;
        for (let i = 0; i <= segs; i++) {
            const a = calCenterA - calSpan * 0.5 + (i / segs) * calSpan;
            const r = calOutR + 0.006 * Math.sin((i / segs) * Math.PI);
            if (i === 0) calShape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else calShape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        for (let i = segs; i >= 0; i--) {
            const a = calCenterA - calSpan * 0.5 + (i / segs) * calSpan;
            calShape.lineTo(Math.cos(a) * calInR, Math.sin(a) * calInR);
        }
        calShape.closePath();

        const calGeo = new THREE.ExtrudeGeometry(calShape, {
            depth: 0.066,
            bevelEnabled: true,
            bevelThickness: 0.015,
            bevelSize: 0.011,
            bevelSegments: 4,
            curveSegments: 16
        });
        calGeo.translate(0, 0, -0.033);
        calGeo.rotateY(Math.PI * 0.5);
        calGeo.translate(rotorX + sideSign * 0.006, 0, 0);
        const calMesh = new THREE.Mesh(calGeo, mat.caliperGold);
        calMesh.castShadow = true;
        knuckleGroup.add(calMesh);

        const pistons = isFront ? [-1, 0, 1] : [-0.65, 0.65];
        pistons.forEach(p => {
            const pa = calCenterA + p * 0.24;
            const pr = (calInR + calOutR) * 0.52;
            knuckleGroup.add(new THREE.Mesh(buildVariableTube([
                [rotorX + sideSign * 0.042, Math.sin(pa) * pr, Math.cos(pa) * pr],
                [rotorX + sideSign * 0.052, Math.sin(pa) * pr, Math.cos(pa) * pr]
            ], 0.007, 5, 6), mat.machinedAlu));
        });

        tagInteractive(cornerRoot, 'wheels');
        return { cornerRoot, knuckleGroup, spinHub, radius };
    };

    [
        { key: 'frontLeft', x: SPEC.fTrack, y: SPEC.fR, z: SPEC.fZ, r: SPEC.fR, w: SPEC.fW, front: true, left: true },
        { key: 'frontRight', x: -SPEC.fTrack, y: SPEC.fR, z: SPEC.fZ, r: SPEC.fR, w: SPEC.fW, front: true, left: false },
        { key: 'rearLeft', x: SPEC.rTrack, y: SPEC.rR, z: SPEC.rZ, r: SPEC.rR, w: SPEC.rW, front: false, left: true },
        { key: 'rearRight', x: -SPEC.rTrack, y: SPEC.rR, z: SPEC.rZ, r: SPEC.rR, w: SPEC.rW, front: false, left: false }
    ].forEach(c => {
        const rig = createWheelCorner(c.r, c.w, c.front, c.left);
        rig.cornerRoot.position.set(c.x, c.y, c.z);
        wheelsParent.add(rig.cornerRoot);
        wheelRig[c.key] = rig;
    });

    return wheelRig;
}

/**
 * 4.9 Habitáculo Interior con Volante Sincronizado a la Dirección
 */
function buildInteriorCockpit(car, mat) {
    const group = new THREE.Group();

    group.add(new THREE.Mesh(buildParametricSurface(16, 12, (u, v) => {
        const s = (v - 0.5) * 2;
        return [s * 0.70, 0.18 + Math.pow(Math.abs(s), 4) * 0.52, lerp(-0.68, 0.78, u)];
    }), mat.matteCarbon));

    group.add(new THREE.Mesh(buildParametricSurface(20, 14, (u, v) => {
        const s = (v - 0.5) * 2;
        const x = s * 0.70;
        const z = lerp(0.32, 0.76, u) - 0.09 * s * s;
        const binnacle = 0.080 * gauss(s, 0.44, 0.22) * Math.sin(u * Math.PI);
        const y = lerp(0.61, 0.70, u) + Math.sin(u * Math.PI) * 0.058 + binnacle - 0.025 * s * s;
        return [x, y, z];
    }, { flipWinding: false }), mat.alcantara));

    group.add(new THREE.Mesh(buildParametricSurface(8, 12, (u, v) => {
        const s = (v - 0.5) * 2;
        return [0.30 + s * 0.130, lerp(0.665, 0.752, u), 0.435 + 0.022 * s * s - 0.02 * u];
    }, { flipWinding: false }), mat.clusterOLED));

    group.add(new THREE.Mesh(buildSplineLoft([
        [[-0.075, 0.57, 0.38], [0.075, 0.57, 0.38], [0.085, 0.49, 0.38], [-0.085, 0.49, 0.38]],
        [[-0.070, 0.46, 0.04], [0.070, 0.46, 0.04], [0.090, 0.33, 0.04], [-0.090, 0.33, 0.04]],
        [[-0.075, 0.43, -0.52], [0.075, 0.43, -0.52], [0.095, 0.23, -0.52], [-0.095, 0.23, -0.52]]
    ], 16, 10, { closedV: true, worldUV: true }), mat.carbon));

    for (let i = 0; i < 4; i++) {
        const swZ = lerp(0.22, 0.02, i / 3);
        const swY = lerp(0.53, 0.47, i / 3);
        group.add(new THREE.Mesh(buildVariableTube([
            [0, swY, swZ],
            [0, swY + 0.020, swZ + 0.008]
        ], 0.005, 5, 6), mat.machinedAlu));
    }

    const makeBucketSeat = (cx) => {
        const sg = new THREE.Group();
        sg.add(new THREE.Mesh(buildParametricSurface(22, 16, (u, v) => {
            const s = (v - 0.5) * 2;
            const absS = Math.abs(s);
            const halfW = 0.205 + 0.042 * gauss(u, 0.72, 0.16) - 0.090 * smoothstep(0.82, 1.0, u);
            const bolster = Math.pow(absS, 2.2) * (0.090 * (1 - 0.55 * smoothstep(0.82, 1.0, u)));
            let y, z;
            if (u < 0.36) {
                const k = u / 0.36;
                z = lerp(0.22, -0.14, k);
                y = lerp(0.32, 0.24, k) + bolster * 0.85;
            } else {
                const k = (u - 0.36) / 0.64;
                z = lerp(-0.14, -0.50, k) + bolster;
                y = lerp(0.24, 0.94, k);
            }
            return [cx + s * halfW, y, z];
        }, { flipWinding: false }), mat.alcantara));

        sg.add(new THREE.Mesh(buildParametricSurface(18, 14, (u, v) => {
            const s = (v - 0.5) * 2;
            const absS = Math.abs(s);
            const halfW = 0.215 + 0.042 * gauss(u, 0.72, 0.16) - 0.090 * smoothstep(0.82, 1.0, u);
            const bolster = Math.pow(absS, 2.2) * (0.090 * (1 - 0.55 * smoothstep(0.82, 1.0, u)));
            return [cx + s * halfW, lerp(0.23, 0.94, u), lerp(-0.15, -0.53, u) + bolster - 0.024];
        }, { worldUV: true, flipWinding: true }), mat.carbon));

        [-1, 1].forEach(side => {
            sg.add(new THREE.Mesh(buildVariableTube([
                [cx + side * 0.19, 0.42, -0.18],
                [cx + side * 0.23, 0.72, -0.32],
                [cx + side * 0.13, 0.93, -0.47]
            ], 0.0045, 14, 8), mat.seatTrimRed));
        });
        return sg;
    };
    group.add(makeBucketSeat(0.30));
    group.add(makeBucketSeat(-0.30));

    // Columna de dirección, levas fijas y volante en "D" rotatorio
    const wg = new THREE.Group();
    wg.position.set(0.30, 0.676, 0.215);
    wg.rotation.x = 0.26;

    [-1, 1].forEach(side => {
        wg.add(new THREE.Mesh(buildVariableTube([
            [side * 0.054, 0.01, -0.046],
            [side * 0.102, 0.044, -0.040],
            [side * 0.112, 0.092, -0.034]
        ], [0.015, 0.004], 12, 8), mat.machinedAlu));
    });

    const steeringWheelSpin = new THREE.Group();
    wg.add(steeringWheelSpin);

    const rimPts = [];
    for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const rx = Math.cos(a) * 0.152;
        let ry = Math.sin(a) * 0.146;
        if (ry < -0.108) ry = -0.108 - (ry + 0.108) * 0.25;
        rimPts.push([rx, ry, 0]);
    }
    steeringWheelSpin.add(new THREE.Mesh(buildVariableTube(rimPts, t => {
        const grip = 1 + 0.22 * Math.pow(Math.cos(t * Math.PI * 2), 4);
        return [0.0145 * grip, 0.0165 * grip];
    }, 36, 10, { closed: true }), mat.alcantara));

    steeringWheelSpin.add(new THREE.Mesh(buildVariableTube([
        [-0.013, 0.146, 0], [0, 0.147, 0], [0.013, 0.146, 0]
    ], 0.0168, 8, 10), mat.anodizedRed));

    [
        [[-0.134, 0.01, -0.005], [-0.04, 0, -0.02], [0, 0, -0.024]],
        [[0.134, 0.01, -0.005], [0.04, 0, -0.02], [0, 0, -0.024]],
        [[0, -0.108, -0.005], [0, -0.05, -0.02], [0, 0, -0.024]]
    ].forEach(pts => {
        steeringWheelSpin.add(new THREE.Mesh(buildVariableTube(pts, [0.013, 0.0075], 10, 8, { worldUV: true }), mat.carbon));
    });
    steeringWheelSpin.add(new THREE.Mesh(buildVariableTube([[0, 0, -0.012], [0, 0, -0.046]], [0.044, 0.040], 8, 12), mat.carbon));

    group.add(wg);
    car.add(group);

    return { steeringWheelSpin };
}

/**
 * 4.10 Sombra Radial Multicapa en el Suelo
 */
function buildSeamlessContactShadow(scene, mat) {
    const shadowGeo = buildParametricSurface(2, 2, (u, v) => [
        lerp(-1.90, 1.90, v),
        0.001,
        lerp(-3.15, 3.15, u)
    ], { flipWinding: false });

    const shadowMesh = new THREE.Mesh(shadowGeo, mat.contactShadow);
    shadowMesh.renderOrder = -1;
    scene.add(shadowMesh);
}

// ============================================================================
// 5. MOTOR DE RENDERIZADO MOBILE-SAFE, CÁMARA TELEOBJETIVO Y BUCLE PRINCIPAL
// ============================================================================

function initHypercarStudio() {
    try {
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
            stencil: false
        });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#050507');
        scene.environment = createAutomotiveStudioEnv(renderer);

        const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
        const camera = new THREE.PerspectiveCamera(36, aspect, 0.1, 60);

        const computeHeroDistanceScale = (asp) => {
            if (asp < 1.0) {
                return clamp(1.18 / Math.max(asp, 0.44), 1.0, 2.20);
            }
            return clamp(1.55 / Math.max(asp, 1.0), 0.92, 1.15);
        };
        const distScale = computeHeroDistanceScale(aspect);
        camera.position.set(
            3.75 * distScale,
            1.22 * lerp(1.0, distScale, 0.30),
            4.25 * distScale
        );

        // Iluminación de estudio equilibrada con mapa de sombras 1024x1024
        const keyLight = new THREE.DirectionalLight('#fff8f0', 1.55);
        keyLight.position.set(4.8, 7.2, 5.2);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        keyLight.shadow.camera.near = 1.0;
        keyLight.shadow.camera.far = 18.0;
        const sc = 3.2;
        keyLight.shadow.camera.left = -sc;
        keyLight.shadow.camera.right = sc;
        keyLight.shadow.camera.top = sc;
        keyLight.shadow.camera.bottom = -sc;
        keyLight.shadow.bias = -0.0005;
        keyLight.shadow.normalBias = 0.018;
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight('#cfe2ff', 0.90);
        rimLight.position.set(-5.2, 3.4, -5.6);
        scene.add(rimLight);

        const lowFill = new THREE.DirectionalLight('#dce6f5', 0.55);
        lowFill.position.set(5.8, 0.85, 1.6);
        scene.add(lowFill);

        const lowFillRear = new THREE.DirectionalLight('#cbd9f0', 0.42);
        lowFillRear.position.set(-4.5, 0.85, -3.8);
        scene.add(lowFillRear);

        const hemiLight = new THREE.HemisphereLight('#5a657d', '#1c1920', 0.52);
        scene.add(hemiLight);

        const textures = createProceduralTextures(renderer.capabilities.getMaxAnisotropy());
        const materials = createMaterials(textures);

        const hypercar = new THREE.Group();
        const bodyGroup = new THREE.Group();
        const wheelsGroup = new THREE.Group();
        hypercar.add(bodyGroup);
        hypercar.add(wheelsGroup);

        buildChassisAndWheelWells(bodyGroup, materials);
        const frunkRig = buildFrontClipAndAero(bodyGroup, materials);
        const doorsRig = buildDoorsAndSideIntakes(bodyGroup, materials);
        buildRearHaunches(bodyGroup, materials);
        buildCanopyAndRoof(bodyGroup, materials);
        buildV12EngineBay(bodyGroup, materials);
        buildRearFasciaAndAero(bodyGroup, materials);
        const cockpitRig = buildInteriorCockpit(bodyGroup, materials);
        const wheelRig = buildWheelsAndBrakes(wheelsGroup, materials);
        scene.add(hypercar);

        buildSeamlessContactShadow(scene, materials);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.45, 0.0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 2.6;
        controls.maxDistance = 12.5;
        controls.minPolarAngle = 0.14;
        controls.maxPolarAngle = Math.PI * 0.5 - 0.035;
        controls.update();

        // Post-procesado estándar (SIN HalfFloatType/MSAA custom) con fallback seguro
        let composer = null;
        let bloomPass = null;
        let useComposer = false;
        try {
            composer = new EffectComposer(renderer);
            composer.setPixelRatio(pixelRatio);
            composer.setSize(window.innerWidth, window.innerHeight);
            composer.addPass(new RenderPass(scene, camera));
            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.20,
                0.35,
                1.55
            );
            composer.addPass(bloomPass);
            composer.addPass(new OutputPass());
            useComposer = true;
        } catch (postErr) {
            console.warn('Post-procesado desactivado, usando renderizado directo:', postErr);
            useComposer = false;
        }

        // MOTOR DE ANIMACIÓN MECÁNICA HIDRÁULICA, ACKERMANN Y COREOGRAFÍA FLUIDA
        const anim = {
            autoMode: true,
            autoClock: 0,
            manualWheelDrive: false,
            manualWheelTime: 0,

            doorL: { value: 0, target: 0, vel: 0 },
            doorR: { value: 0, target: 0, vel: 0 },
            frunk: { value: 0, target: 0, vel: 0 },

            wheelSpeed: 0,
            targetSpeed: 0,
            steerAngle: 0,
            targetSteer: 0,
            frontSpin: 0,
            rearSpin: 0,
            pitch: 0,
            roll: 0,
            heave: 0,

            pulseTime: -1,
            prevDoorLTarget: 0,
            prevDoorRTarget: 0,
            prevFrunkTarget: 0
        };

        const triggerOpticalPulse = () => {
            anim.pulseTime = 0;
        };

        const stepHydraulic = (state, dt, maxSpeed = 0.56) => {
            const diff = state.target - state.value;
            const dist = Math.abs(diff);
            const cushion = smootherstep(0.0, 0.24, dist);
            const rateLimit = lerp(0.10, maxSpeed, cushion);
            const desiredVel = clamp(diff * 2.8, -rateLimit, rateLimit);
            state.vel = lerp(state.vel, desiredVel, clamp(dt * 6.5, 0, 1));
            state.value = clamp(state.value + state.vel * dt, 0, 1);
            if (dist < 0.0006 && Math.abs(state.vel) < 0.0015) {
                state.value = state.target;
                state.vel = 0;
            }
            return state.value;
        };

        // INTERACCIÓN DIRECTA POR TOQUE / CLIC SIN SELECTORES UI
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        let downX = 0, downY = 0, downTime = 0, lastEmptyTapTime = 0;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            downX = e.clientX;
            downY = e.clientY;
            downTime = performance.now();
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const dx = e.clientX - downX;
            const dy = e.clientY - downY;
            const dtMs = performance.now() - downTime;
            if (Math.hypot(dx, dy) > 8 || dtMs > 380) return;

            const rect = renderer.domElement.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointerNDC, camera);
            const hits = raycaster.intersectObjects(hypercar.children, true);

            let hitPart = null;
            for (const h of hits) {
                if (h.object.userData && h.object.userData.interactivePart) {
                    hitPart = h.object.userData.interactivePart;
                    break;
                }
            }

            if (hitPart === 'doorL') {
                anim.autoMode = false;
                anim.doorL.target = anim.doorL.target > 0.5 ? 0 : 1;
                triggerOpticalPulse();
            } else if (hitPart === 'doorR') {
                anim.autoMode = false;
                anim.doorR.target = anim.doorR.target > 0.5 ? 0 : 1;
                triggerOpticalPulse();
            } else if (hitPart === 'frunk') {
                anim.autoMode = false;
                anim.frunk.target = anim.frunk.target > 0.5 ? 0 : 1;
                triggerOpticalPulse();
            } else if (hitPart === 'wheels') {
                anim.autoMode = false;
                anim.manualWheelDrive = !anim.manualWheelDrive;
            } else if (hits.length === 0) {
                const now = performance.now();
                if (now - lastEmptyTapTime < 380) {
                    anim.autoMode = true;
                    anim.manualWheelDrive = false;
                    anim.autoClock = 0;
                    triggerOpticalPulse();
                    lastEmptyTapTime = 0;
                } else {
                    lastEmptyTapTime = now;
                }
            }
        });

        window.addEventListener('resize', () => {
            const w = Math.max(window.innerWidth, 1);
            const h = Math.max(window.innerHeight, 1);
            const pr = Math.min(window.devicePixelRatio || 1, 2);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(pr);
            renderer.setSize(w, h);
            if (useComposer && composer && bloomPass) {
                composer.setPixelRatio(pr);
                composer.setSize(w, h);
                bloomPass.setSize(w, h);
            }
        });

        let lastTime = performance.now();
        const LOOP_DURATION = 33.0;
        const WHEELBASE = SPEC.fZ - SPEC.rZ;
        const TRACK = SPEC.fTrack * 2.0;

        function animate(now) {
            requestAnimationFrame(animate);
            try {
                const dt = Math.min(Math.max((now - lastTime) * 0.001, 0.0001), 0.05);
                lastTime = now;

                if (anim.autoMode) {
                    const prevT = anim.autoClock;
                    anim.autoClock = (anim.autoClock + dt) % LOOP_DURATION;
                    const t = anim.autoClock;

                    // Pulso inicial de desbloqueo al arrancar el ciclo
                    if (prevT > t || (prevT < 0.4 && t >= 0.4)) {
                        triggerOpticalPulse();
                    }

                    if (t >= 1.6 && t < 7.8) {
                        const k = (t - 1.6) / 6.2;
                        anim.targetSpeed = 3.2 * Math.sin(k * Math.PI);
                        anim.targetSteer = THREE.MathUtils.degToRad(22) * Math.sin(k * Math.PI * 2.0);
                    } else if (t >= 27.0 && t < 32.2) {
                        const k = (t - 27.0) / 5.2;
                        anim.targetSpeed = 3.5 * Math.sin(k * Math.PI);
                        anim.targetSteer = -THREE.MathUtils.degToRad(21) * Math.sin(k * Math.PI * 2.0);
                    } else {
                        anim.targetSpeed = 0;
                        anim.targetSteer = 0;
                    }

                    anim.doorL.target = (t >= 8.2 && t < 23.8) ? 1 : 0;
                    anim.doorR.target = (t >= 8.75 && t < 23.2) ? 1 : 0;
                    anim.frunk.target = (t >= 12.0 && t < 20.6) ? 1 : 0;

                    if (anim.doorL.target !== anim.prevDoorLTarget ||
                        anim.doorR.target !== anim.prevDoorRTarget ||
                        anim.frunk.target !== anim.prevFrunkTarget) {
                        triggerOpticalPulse();
                    }
                    anim.prevDoorLTarget = anim.doorL.target;
                    anim.prevDoorRTarget = anim.doorR.target;
                    anim.prevFrunkTarget = anim.frunk.target;
                } else {
                    if (anim.manualWheelDrive) {
                        anim.manualWheelTime += dt;
                        anim.targetSpeed = 3.0;
                        anim.targetSteer = THREE.MathUtils.degToRad(22) * Math.sin(anim.manualWheelTime * 1.15);
                    } else {
                        anim.targetSpeed = 0;
                        anim.targetSteer = 0;
                    }
                }

                // Rodadura física y geometría de dirección Ackermann real
                const prevSpeed = anim.wheelSpeed;
                anim.wheelSpeed = lerp(anim.wheelSpeed, anim.targetSpeed, clamp(dt * 3.2, 0, 1));
                anim.steerAngle = lerp(anim.steerAngle, anim.targetSteer, clamp(dt * 4.5, 0, 1));
                const accel = (anim.wheelSpeed - prevSpeed) / Math.max(dt, 0.001);

                const distStep = anim.wheelSpeed * dt;
                anim.frontSpin += distStep / SPEC.fR;
                anim.rearSpin += distStep / SPEC.rR;

                let leftSteer = 0, rightSteer = 0;
                const absSteer = Math.abs(anim.steerAngle);
                if (absSteer > 1e-4) {
                    const R = WHEELBASE / Math.tan(absSteer);
                    const innerA = Math.min(Math.atan(WHEELBASE / Math.max(R - TRACK * 0.5, 0.5)), THREE.MathUtils.degToRad(24.0));
                    const outerA = Math.atan(WHEELBASE / (R + TRACK * 0.5));
                    if (anim.steerAngle > 0) {
                        leftSteer = innerA;
                        rightSteer = outerA;
                    } else {
                        leftSteer = -outerA;
                        rightSteer = -innerA;
                    }
                }

                wheelRig.frontLeft.knuckleGroup.rotation.y = leftSteer;
                wheelRig.frontRight.knuckleGroup.rotation.y = rightSteer;
                wheelRig.frontLeft.spinHub.rotation.x = anim.frontSpin;
                wheelRig.frontRight.spinHub.rotation.x = anim.frontSpin;
                wheelRig.rearLeft.spinHub.rotation.x = anim.rearSpin;
                wheelRig.rearRight.spinHub.rotation.x = anim.rearSpin;

                // Volante sincronizado con las ruedas delanteras
                cockpitRig.steeringWheelSpin.rotation.z = -anim.steerAngle * 2.4;

                // Micro-suspensión dinámica (cabeceo y balanceo)
                const targetPitch = clamp(-accel * 0.0042, -0.011, 0.011);
                const targetRoll = clamp(anim.wheelSpeed * anim.steerAngle * 0.009, -0.012, 0.012);
                const roadMicro = anim.wheelSpeed > 0.05 ? Math.sin(now * 0.018) * 0.0016 * clamp(anim.wheelSpeed / 3.0, 0, 1) : 0;
                anim.pitch = lerp(anim.pitch, targetPitch, clamp(dt * 6.0, 0, 1));
                anim.roll = lerp(anim.roll, targetRoll, clamp(dt * 6.0, 0, 1));
                anim.heave = lerp(anim.heave, roadMicro, clamp(dt * 8.0, 0, 1));

                bodyGroup.rotation.x = anim.pitch;
                bodyGroup.rotation.z = anim.roll;
                bodyGroup.position.y = anim.heave;

                // Cinemática hidráulica de puertas diédricas y maletero delantero (44°)
                const dL = stepHydraulic(anim.doorL, dt, 0.54);
                const dR = stepHydraulic(anim.doorR, dt, 0.54);
                const fr = stepHydraulic(anim.frunk, dt, 0.58);

                doorsRig.doorL.pivot.quaternion.setFromAxisAngle(doorsRig.doorL.dihedralAxis, dL * doorsRig.doorL.maxAngle);
                doorsRig.doorR.pivot.quaternion.setFromAxisAngle(doorsRig.doorR.dihedralAxis, dR * doorsRig.doorR.maxAngle);
                frunkRig.frunkPivot.rotation.x = -fr * THREE.MathUtils.degToRad(44);

                // Iluminación de bienvenida en cabina y maletero
                const doorOpenMax = Math.max(dL, dR);
                doorsRig.cabinWelcomeLight.intensity = smoothstep(0.05, 0.75, doorOpenMax) * 1.15;
                const frGlow = smoothstep(0.06, 0.70, fr);
                frunkRig.frunkLight.intensity = frGlow * 1.10;
                frunkRig.frunkLedMat.emissiveIntensity = frGlow * 2.15;

                // Pulso óptico de bienvenida en DRL y pilotos traseros
                let pulseBoost = 0;
                if (anim.pulseTime >= 0) {
                    anim.pulseTime += dt;
                    if (anim.pulseTime < 0.65) {
                        const p1 = Math.exp(-Math.pow((anim.pulseTime - 0.12) / 0.06, 2));
                        const p2 = Math.exp(-Math.pow((anim.pulseTime - 0.34) / 0.07, 2)) * 0.85;
                        pulseBoost = Math.max(p1, p2);
                    } else {
                        anim.pulseTime = -1;
                    }
                }
                materials.ledWhite.emissiveIntensity = 2.35 + pulseBoost * 1.35;
                materials.ledRed.emissiveIntensity = 2.45 + pulseBoost * 1.25;

                // Actualización en tiempo real de los 4 pistones hidráulicos telescópicos
                bodyGroup.updateMatrixWorld(true);
                doorsRig.doorL.updateStrut(bodyGroup);
                doorsRig.doorR.updateStrut(bodyGroup);
                frunkRig.updateStruts(bodyGroup);

                controls.update();

                if (useComposer && composer) {
                    try {
                        composer.render();
                    } catch (renderErr) {
                        console.warn('Fallback a renderizado directo:', renderErr);
                        useComposer = false;
                        renderer.render(scene, camera);
                    }
                } else {
                    renderer.render(scene, camera);
                }
            } catch (loopErr) {
                console.error('Error en bucle de animación:', loopErr);
            }
        }
        requestAnimationFrame(animate);
    } catch (err) {
        console.error('Error fatal inicializando el estudio 3D:', err);
        showFatalError('No se pudo inicializar el motor 3D WebGL: ' + (err && err.message ? err.message : err));
    }
}

if (document.readyState === 'complete') {
